<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加工部查詢系統PDS</title>
    <link rel="icon" type="image/png" href="/static/app-icon.png">
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --erp-blue:        #1565C0;
            --erp-blue-dark:   #0D47A1;
            --erp-blue-mid:    #1976D2;
            --erp-blue-light:  #E3F2FD;
            --erp-blue-pale:   #F0F7FF;
            --erp-bg:          #ECF0F5;
            --erp-surface:     #FFFFFF;
            --erp-border:      #BDC3C7;
            --erp-border-dark: #95A5A6;
            --erp-text:        #212121;
            --erp-text-muted:  #546E7A;
            --erp-row-even:    #F5F9FF;
            --erp-row-hover:   #DDEEFF;
            --success:         #2E7D32;
            --success-bg:      #E8F5E9;
            --warning:         #E65100;
            --warning-bg:      #FFF3E0;
            --danger:          #C62828;
        }
        * { box-sizing: border-box; }
        body, * { font-family: 'Noto Sans TC', 'Source Han Sans TC', sans-serif; }
        body {
            background: var(--erp-bg); color: var(--erp-text);
            font-size: 0.85rem; margin: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .header{background:#1565C0;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.3)}
        .header-inner{display:flex;align-items:flex-end;padding:.4rem 1rem 0}
        .header-logo{margin-left:auto;align-self:center;font-size:1.15rem;font-weight:800;font-style:italic;letter-spacing:.03em;color:#F5A623}
        .header-title{font-size:1.1rem;font-weight:700;padding-bottom:.45rem;white-space:nowrap;margin-right:.5rem}
        .header-tabs{display:flex;align-items:flex-end;gap:2px}
        .header-tab{display:inline-block;padding:.3rem .75rem;font-size:1rem;font-weight:600;white-space:nowrap;
          color:rgba(255,255,255,.85);text-decoration:none;border-radius:0;
          background:rgba(255,255,255,.15);cursor:pointer;transition:background .15s}
        .header-tab.active,.header-tab:hover{background:#fff;color:#1565C0}

        
        .header-tab-mgmt{background:#06C755;color:#fff}
        .header-tab-mgmt.active,.header-tab-mgmt:hover{background:#05A649;color:#fff}
        .header-tab-zumen{background:#4FC3F7;color:#fff;letter-spacing:.06em}
        .header-tab-zumen.active,.header-tab-zumen:hover{background:#039BE5;color:#fff}.main { flex:1; display:flex; flex-direction:column; overflow:hidden; padding: .75rem 1rem; gap:.6rem; }

        .toolbar {
            background: var(--erp-surface); border:1px solid var(--erp-border);
            border-radius:6px; padding:.6rem .8rem; display:flex; align-items:center;
            gap:.5rem; flex-wrap:wrap; flex-shrink:0;
        }
        .toolbar input[type=text] { font-size:.84rem; padding:.35rem .6rem; border:1px solid var(--erp-border-dark); border-radius:4px; }
        .toolbar .btn { font-size:.82rem; }
        #searchInput { width: 320px; }
        .toolbar .spacer { flex:1; }
        #lastUpdated { font-size:.76rem; color:var(--erp-text-muted); white-space:nowrap; }

        .machine-filter-bar { display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; padding:0 .2rem; }
        .machine-filter-label { font-size:.76rem; color:var(--erp-text-muted); margin-right:.15rem; white-space:nowrap; }
        .machine-chip {
            display:inline-flex; align-items:center; padding:.2rem .65rem; border-radius:999px;
            font-size:.78rem; font-weight:600; border:1.5px solid var(--erp-border);
            background:var(--erp-surface); color:var(--erp-text-muted); cursor:pointer; white-space:nowrap;
            transition:background .15s,border-color .15s,color .15s;
        }
        .machine-chip:hover { border-color:var(--erp-blue-mid); color:var(--erp-blue-dark); }
        .machine-chip.active { background:var(--erp-blue); border-color:var(--erp-blue); color:#fff; }

        .cnc-progress-wrap { display:flex; align-items:center; gap:.4rem; }
        .cnc-progress-bar { width:110px; height:7px; border-radius:4px; background:#CFD8DC; overflow:hidden; position:relative; }
        .cnc-progress-bar .cnc-progress-fill {
            position:absolute; top:0; height:100%; width:40%; border-radius:4px;
            background:linear-gradient(90deg,#42A5F5,#1565C0);
            animation: cnc-indeterminate 1.1s ease-in-out infinite;
        }
        @keyframes cnc-indeterminate { 0% { left:-40%; } 100% { left:100%; } }
        .cnc-progress-pct { font-size:.78rem; color:var(--erp-blue-dark); font-weight:700; white-space:nowrap; }
        .cnc-progress-pct.is-err { color:var(--danger); }

        .table-wrap { flex:1; overflow:auto; background:var(--erp-surface); border:1px solid var(--erp-border); border-radius:6px; }
        table.cnc-table { width:100%; border-collapse:collapse; }
        table.cnc-table th {
            position:sticky; top:0; z-index:2; padding:.5rem .75rem; font-size:.8rem; font-weight:600;
            text-align:left; color:rgba(255,255,255,.95);
            background:linear-gradient(180deg, var(--erp-blue-mid), var(--erp-blue-dark));
        }
        table.cnc-table td { padding:.4rem .75rem; font-size:.85rem; color:var(--erp-text); border-bottom:1px solid #EEF1F4; vertical-align:middle; }
        table.cnc-table tr:nth-child(even) td { background:var(--erp-row-even); }
        table.cnc-table tr:hover td { background:var(--erp-row-hover); }
        td.cnc-model span { padding:.1rem .5rem; border-radius:10px; font-weight:700; font-size:.8rem; background:var(--erp-blue-light); color:var(--erp-blue-dark); white-space:nowrap; }
        td.cnc-machine { color:var(--erp-text-muted); font-size:.8rem; }
        td.cnc-size { text-align:right; color:var(--erp-text-muted); font-size:.78rem; white-space:nowrap; }
        td.cnc-mtime { white-space:nowrap; font-size:.78rem; color:var(--erp-text-muted); }
        .cnc-filename { font-family:'Consolas','Courier New',monospace; font-size:.82rem; line-height:1.35; word-break:break-all; }
        .cnc-remark { color:var(--erp-text-muted); font-size:.76rem; line-height:1.2; word-break:break-all; }
        .cnc-actions { display:flex; align-items:center; gap:.2rem; white-space:nowrap; }
        .icon-btn {
            width:34px; height:34px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
            border:none; border-radius:7px; background:transparent;
            cursor:pointer; transition:background .15s, color .15s;
        }
        .icon-btn svg { width:20px; height:20px; }
        .icon-btn-view { color:var(--erp-blue-mid); }
        .icon-btn-view:hover { background:var(--erp-blue-pale); color:var(--erp-blue-dark); }
        .icon-btn-download { color:var(--success); }
        .icon-btn-download:hover { background:var(--success-bg); color:#1B5E20; }
        .icon-btn-folder { color:#B8860B; }
        .icon-btn-folder:hover { background:#FFF3E0; color:#8A5A00; }
        .icon-btn-delete { color:var(--danger); }
        .icon-btn-delete:hover { background:#FDECEA; color:#8E1A1A; }
        .icon-divider { width:1px; height:20px; background:var(--erp-border); margin:0 .2rem; flex-shrink:0; }
        #emptyMsg, #loadingMsg { text-align:center; padding:2rem; color:var(--erp-text-muted); }

        #viewModal .code-area { display:flex; align-items:flex-start; gap:.6rem; }
        #viewModal #viewModalContent { flex:1; min-width:0; }
        #viewModal .code-view { width:100%; background:#1E1E1E; color:#D4D4D4; padding:.5rem 0; border-radius:6px;
            font-family:'Consolas','Courier New',monospace; font-size:1.05rem; line-height:1.6;
            max-height:72vh; overflow:auto; margin:0; box-sizing:border-box; }
        #viewModal .code-line { padding:0 .7rem; transition:background .3s; }
        #viewModal .code-line:hover { background:rgba(255,255,255,.04); }
        #viewModal .code-line.flash { background:rgba(255,214,0,.22); }
        #viewModal .code-content { white-space:pre-wrap; word-break:break-all; }
        #viewModal img { max-width:100%; max-height:60vh; display:block; margin:0 auto; }
        #viewModal .code-edit { width:100%; background:#1E1E1E; color:#D4D4D4; padding:.6rem .7rem;
            border-radius:6px; font-family:'Consolas','Courier New',monospace; font-size:1.05rem; line-height:1.6;
            height:80vh; box-sizing:border-box; border:1px solid #3A3A3A; resize:vertical; }
        #viewModal .code-edit:focus { outline:none; border-color:#1565C0; }
        #viewModal .code-view mark { background:#FFD600; color:#1E1E1E; border-radius:2px; }
        #viewModal .code-view mark.active { background:#FF6F00; color:#fff; }

        #viewModal .tool-sidebar {
            flex-shrink:0; width:128px; max-height:72vh; overflow-y:auto; overflow-x:hidden;
            background:#1E1E1E; border-radius:6px; padding:.5rem 0;
        }
        #viewModal .tool-sidebar-item {
            display:block; width:100%; text-align:left; background:transparent; border:none;
            color:#4ADE80; font-family:'Consolas','Courier New',monospace; font-size:1.05rem; font-weight:700;
            padding:.45rem .7rem; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
            border-left:3px solid transparent; transition:background .15s, color .15s;
        }
        #viewModal .tool-sidebar-item:hover { background:rgba(255,255,255,.08); color:#86EFAC; }
        #viewModal .tool-sidebar-item.active { background:rgba(46,125,50,.35); color:#fff; border-left-color:#4ADE80; }

        .view-search-bar {
            display:flex; align-items:center; gap:.5rem; background:var(--erp-surface-2,#FAFBFC);
            border:1.5px solid var(--erp-border); border-radius:8px; padding:.4rem .6rem; margin-bottom:.7rem;
        }
        .view-search-bar svg { width:17px; height:17px; color:var(--erp-text-muted); flex-shrink:0; }
        .view-search-bar input { flex:1; border:none; outline:none; background:transparent; font-size:.92rem; color:var(--erp-text); }
        .view-search-count { font-size:.78rem; color:var(--erp-text-muted); white-space:nowrap; min-width:3.5em; text-align:right; }
        .view-search-bar .icon-btn { width:28px; height:28px; }
        .view-search-bar .icon-btn svg { width:16px; height:16px; }

        .form-hint { font-size:.74rem; color:var(--erp-text-muted); margin-top:.15rem; }

        /* ── 質感 Modal 表單 ── */
        #uploadModal .modal-dialog, #newModelModal .modal-dialog { max-width:620px; }
        #uploadModal .modal-content, #newModelModal .modal-content {
            border:none; border-radius:14px; overflow:hidden;
            box-shadow:0 16px 40px rgba(13,71,161,.22), 0 4px 10px rgba(0,0,0,.08);
        }
        #uploadModal .modal-header, #newModelModal .modal-header {
            background:linear-gradient(95deg, var(--erp-blue-mid), var(--erp-blue-dark));
            border-bottom:none; padding:1.3rem 1.6rem;
        }
        #uploadModal .modal-title, #newModelModal .modal-title {
            color:#fff; font-size:1.25rem; font-weight:700; display:flex; align-items:center; gap:.6rem;
        }
        #uploadModal .btn-close, #newModelModal .btn-close { filter:brightness(0) invert(1); opacity:.85; transform:scale(1.2); }
        #uploadModal .btn-close:hover, #newModelModal .btn-close:hover { opacity:1; }
        #uploadModal .modal-body, #newModelModal .modal-body { padding:1.7rem 1.6rem .5rem; }
        #uploadModal .modal-footer, #newModelModal .modal-footer {
            border-top:1px solid #EEF1F4; padding:1.1rem 1.6rem; background:#FAFBFC;
        }
        .lead-hint {
            font-size:.92rem; color:var(--erp-text-muted); line-height:1.6; margin:0 0 1.3rem;
            padding:.8rem 1rem; background:var(--erp-blue-pale); border-radius:8px;
            border-left:3px solid var(--erp-blue-mid);
        }
        .field-group { margin-bottom:1.3rem; }
        .field-label {
            display:flex; align-items:baseline; gap:.45rem; font-size:.92rem; font-weight:700;
            color:var(--erp-blue-dark); margin-bottom:.5rem; letter-spacing:.01em;
        }
        .field-label .optional { color:var(--erp-text-muted); font-weight:500; font-size:.8rem; }
        .field-group .form-control {
            border:1.5px solid var(--erp-border); border-radius:8px; padding:.7rem .9rem;
            font-size:1.05rem; transition:border-color .15s, box-shadow .15s;
        }
        .field-group .form-control:focus {
            border-color:var(--erp-blue-mid); box-shadow:0 0 0 3px rgba(25,118,210,.12);
        }
        .field-hint { font-size:.84rem; color:var(--erp-text-muted); margin-top:.45rem; line-height:1.5; }
        .field-hint.is-new { color:var(--success); font-weight:600; }
        .field-hint.is-existing { color:var(--erp-blue-mid); font-weight:600; }

        .file-picker {
            display:flex; align-items:center; gap:.75rem; border:1.5px dashed var(--erp-border-dark);
            border-radius:8px; padding:.95rem 1.05rem; cursor:pointer; background:var(--erp-surface-2,#FAFBFC);
            transition:border-color .15s, background .15s; margin-bottom:0;
        }
        .file-picker:hover, .file-picker.drag-over { border-color:var(--erp-blue-mid); background:var(--erp-blue-pale); }
        .file-picker .fp-icon { color:var(--erp-blue-mid); flex-shrink:0; display:flex; }
        .file-picker .fp-icon svg { width:26px; height:26px; }
        .file-picker .fp-text { font-size:1.02rem; color:var(--erp-text-muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .file-picker .fp-text.has-file { color:var(--erp-text); font-weight:600; }
        .file-picker input[type=file] { display:none; }

        #uploadModal .btn-success, #newModelModal .btn-success {
            display:inline-flex; align-items:center; gap:.45rem; font-weight:600; font-size:1.02rem; border-radius:8px;
            padding:.65rem 1.4rem; box-shadow:0 2px 6px rgba(46,125,50,.25);
        }
        #uploadModal .btn-secondary, #newModelModal .btn-secondary {
            background:transparent; border:1.5px solid var(--erp-border-dark); color:var(--erp-text-muted);
            border-radius:8px; padding:.65rem 1.3rem; font-weight:600; font-size:1.02rem;
        }
        #uploadModal .btn-secondary:hover, #newModelModal .btn-secondary:hover { background:#F2F4F6; }
    </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-title">加工部查詢系統PDS</div>
    <div class="header-tabs">
      <a href="/"           class="header-tab">製令查詢</a>
      <a href="/production" class="header-tab">生產中製令</a>
      <a href="/equipment"  class="header-tab">設備稼動</a>
      <a href="/drawing"    class="header-tab">PDM圖面查詢</a>
      <a href="/routing"    class="header-tab">產品途程查詢</a>
      <a href="/batch_cost" class="header-tab">批成本</a>
      <span                 class="header-tab active">程式管理</span>
      <a href="/oil"        class="header-tab">油品管理</a>
      <a href="/equipment_master" class="header-tab">設備管理</a>
      <a href="/zumen" class="header-tab header-tab-zumen">ZUMEN</a>
      <a href="/management" class="header-tab header-tab-mgmt">管理</a>
    </div>
    <span class="header-logo">MAXCLAW</span>
  </div>
</div>

<div class="main">
  <div class="toolbar">
    <input type="text" id="searchInput" class="form-control" placeholder="系列/機型品名/機台/檔名/備註關鍵字，空格=AND，-前綴=排除（留空＝全部）">
    <button class="btn btn-primary" id="btnSearch">🔍 搜尋</button>
    <span class="spacer"></span>
    <span id="lastUpdated"></span>
    <button class="btn btn-outline-secondary" id="btnRebuild">↻ 重建索引</button>
    <span id="cncRebuildWrap" class="cnc-progress-wrap" style="display:none">
        <span class="cnc-progress-bar"><span class="cnc-progress-fill"></span></span>
        <span id="cncRebuildPct" class="cnc-progress-pct">啟動中…</span>
    </span>
    <button class="btn btn-outline-success" id="btnNewModel">＋ 新增範本</button>
    <button class="btn btn-success" id="btnUpload">⬆ 上傳程式</button>
  </div>

  <div class="machine-filter-bar" id="machineFilterBar"></div>

  <div class="table-wrap">
    <table class="cnc-table">
      <thead>
        <tr>
          <th style="width:90px;">系列</th>
          <th style="width:160px;">機型品名</th>
          <th style="width:170px;">機台</th>
          <th style="width:300px;">檔名 / 備註</th>
          <th style="width:130px;">修改時間</th>
          <th style="width:80px;" class="text-end">大小</th>
          <th style="width:175px;">操作</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
    <div id="loadingMsg" style="display:none;">搜尋中...</div>
    <div id="emptyMsg" style="display:none;">查無符合的程式檔，試試其他關鍵字，或按「重建索引」更新資料</div>
  </div>
</div>

<!-- 檢視 Modal -->
<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:min(1400px,94vw);">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="viewModalTitle">檔案內容</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="viewModalBody">
        <div class="view-search-bar" id="viewSearchBar" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="viewSearchInput" placeholder="搜尋程式碼內容...">
          <span class="view-search-count" id="viewSearchCount"></span>
          <button class="icon-btn icon-btn-view" id="viewSearchPrev" title="上一個 (Shift+Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
          </button>
          <button class="icon-btn icon-btn-view" id="viewSearchNext" title="下一個 (Enter)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
        <div class="code-area">
          <div class="tool-sidebar" id="toolSidebar" style="display:none;"></div>
          <div id="viewModalContent"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-primary" id="viewModalEdit" onclick="toggleEditMode()">✏️ 編輯</button>
        <button class="btn btn-outline-secondary" id="viewModalSaveAs" onclick="promptSaveAs()">另存新檔</button>
        <button class="btn btn-success" id="viewModalSave" style="display:none" onclick="saveEditedFile()">💾 儲存</button>
        <button class="btn btn-outline-secondary" id="viewModalCancelEdit" style="display:none" onclick="cancelEditMode()">取消編輯</button>
        <button class="btn btn-primary" id="viewModalDownload">下載</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
      </div>
    </div>
  </div>
</div>

<!-- 上傳 Modal -->
<div class="modal fade" id="uploadModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">⬆ 上傳程式檔</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="uploadError" class="alert alert-danger" style="display:none;"></div>
        <div class="field-group">
          <label class="field-label">系列</label>
          <input type="text" class="form-control" id="uploadTop" list="dlTop" autocomplete="off" placeholder="例：FTB系列">
        </div>
        <div class="field-group">
          <label class="field-label">機型品名</label>
          <input type="text" class="form-control" id="uploadModel" list="dlModel" autocomplete="off" placeholder="例：FTB210A夾管座">
          <div class="field-hint" id="uploadModelHint"></div>
        </div>
        <div class="field-group">
          <label class="field-label">機台 <span class="optional">可留空</span></label>
          <select class="form-control" id="uploadMachine">
            <option value="">（不分機台）</option>
          </select>
          <div class="field-hint">若此機型品名用機台子資料夾分類就選，沒有就留空直接放在機型品名資料夾下</div>
        </div>
        <div class="field-group">
          <label class="field-label">選擇檔案</label>
          <label class="file-picker" id="filePickerLabel" for="uploadFile">
            <span class="fp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg></span>
            <span class="fp-text" id="filePickerText">點擊選擇檔案，或拖曳到此處</span>
            <input type="file" id="uploadFile">
          </label>
        </div>
        <datalist id="dlTop"></datalist>
        <datalist id="dlModel"></datalist>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" id="btnUploadSubmit">⬆ 上傳</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- 新增範本 Modal -->
<div class="modal fade" id="newModelModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">＋ 新增範本</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="newModelError" class="alert alert-danger" style="display:none;"></div>
        <p class="lead-hint">會在指定系列底下建立新的機型品名資料夾，並複製【空白範本】整套機台空資料夾，之後就能用「上傳程式」把檔案放進去對應機台。</p>
        <div class="field-group">
          <label class="field-label">系列 <span class="optional">既有或新名稱</span></label>
          <input type="text" class="form-control" id="newModelTop" list="dlTop" autocomplete="off" placeholder="例：FTB系列">
        </div>
        <div class="field-group">
          <label class="field-label">新機型品名</label>
          <input type="text" class="form-control" id="newModelName" autocomplete="off" placeholder="例：FTB500新機型">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" id="btnNewModelSubmit">＋ 建立</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script>
const resultBody  = document.getElementById('resultBody');
const loadingMsg  = document.getElementById('loadingMsg');
const emptyMsg    = document.getElementById('emptyMsg');
const searchInput = document.getElementById('searchInput');
const lastUpdated = document.getElementById('lastUpdated');

let cncTree = {};   // {top_folder: {model: [machine,...]}}
let currentRows = [];
let rawRows = [];   // doSearch() 拿到的原始結果（套用機台快篩前）
let lastTruncated = false, lastCount = 0;
let currentMachineFilter = '';

const ICON_VIEW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_DOWNLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>';
const ICON_DELETE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
const ICON_FOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h5l2 2h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/></svg>';

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtSize(n) {
    if (!n) return '';
    if (n < 1024) return n + ' B';
    if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
    return (n/1024/1024).toFixed(1) + ' MB';
}

async function doSearch() {
    loadingMsg.style.display = 'block';
    emptyMsg.style.display = 'none';
    resultBody.innerHTML = '';
    try {
        const q = searchInput.value.trim();
        const resp = await fetch('/api/cnc_program/search?q=' + encodeURIComponent(q));
        const json = await resp.json();
        loadingMsg.style.display = 'none';
        if (!json.success) {
            emptyMsg.textContent = json.error || '查詢失敗';
            emptyMsg.style.display = 'block';
            return;
        }
        rawRows = json.data;
        lastTruncated = json.truncated;
        lastCount = json.count;
        renderMachineChips();
        applyMachineFilter();
    } catch (e) {
        loadingMsg.style.display = 'none';
        emptyMsg.textContent = '查詢失敗：' + e;
        emptyMsg.style.display = 'block';
    }
}

// 機台快篩：在 doSearch() 抓到的結果上，用機台名稱再做一次客戶端篩選（不用重打 API）
function applyMachineFilter() {
    currentRows = currentMachineFilter
        ? rawRows.filter(r => r.machine === currentMachineFilter)
        : rawRows;
    if (currentRows.length === 0) {
        emptyMsg.textContent = currentMachineFilter
            ? '「' + currentMachineFilter + '」查無符合的程式檔'
            : '查無符合的程式檔，試試其他關鍵字，或按「重建索引」更新資料';
        emptyMsg.style.display = 'block';
        resultBody.innerHTML = '';
        return;
    }
    emptyMsg.style.display = 'none';
    renderRows(currentRows, !currentMachineFilter && lastTruncated, lastCount);
}

// 快篩清單只列「目前搜尋結果裡實際出現的機台」，不是全廠機台清單，
// 避免打關鍵字後列出一堆這次查詢根本查不到的機台徽章
function renderMachineChips() {
    const bar = document.getElementById('machineFilterBar');
    const machinesInResults = Array.from(new Set(rawRows.map(r => r.machine).filter(Boolean))).sort();
    if (currentMachineFilter && !machinesInResults.includes(currentMachineFilter)) {
        currentMachineFilter = '';
    }
    if (!machinesInResults.length) { bar.innerHTML = ''; return; }
    bar.innerHTML = '<span class="machine-filter-label">機台快篩：</span>' +
        machinesInResults.map(m => '<span class="machine-chip' + (m === currentMachineFilter ? ' active' : '') +
            '" onclick="cncFilterByMachine(' + JSON.stringify(m).replace(/"/g, '&quot;') + ')">' + esc(m) + '</span>').join('');
}

function cncFilterByMachine(m) {
    currentMachineFilter = (currentMachineFilter === m) ? '' : m;
    renderMachineChips();
    applyMachineFilter();
}

function renderRows(rows, truncated, totalCount) {
    resultBody.innerHTML = rows.map((r, idx) => `
        <tr>
            <td>${esc(r.top_folder)}</td>
            <td class="cnc-model">${r.model ? '<span>' + esc(r.model) + '</span>' : ''}</td>
            <td class="cnc-machine">${esc(r.machine)}</td>
            <td>
                <div class="cnc-filename">${esc(r.filename)}</div>
                ${r.remark ? '<div class="cnc-remark">' + esc(r.remark) + '</div>' : ''}
            </td>
            <td class="cnc-mtime">${esc(r.mtime)}</td>
            <td class="cnc-size">${fmtSize(r.size)}</td>
            <td class="cnc-actions">
                <button class="icon-btn icon-btn-view" title="檢視" onclick="viewFile(${idx})">${ICON_VIEW}</button>
                <button class="icon-btn icon-btn-download" title="下載" onclick="downloadFile(${idx})">${ICON_DOWNLOAD}</button>
                <button class="icon-btn icon-btn-folder" title="開啟所在資料夾" onclick="openFolder(${idx})">${ICON_FOLDER}</button>
                <span class="icon-divider"></span>
                <button class="icon-btn icon-btn-delete" title="刪除" onclick="deleteFile(${idx})">${ICON_DELETE}</button>
            </td>
        </tr>
    `).join('');
    if (truncated) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="7" style="text-align:center;color:var(--warning);font-size:.78rem;">
            結果過多，僅顯示前 300 筆（共 ${totalCount} 筆符合），請輸入更精確的關鍵字</td>`;
        resultBody.appendChild(tr);
    }
}

let viewRawText = '';
let viewMatches = [];
let viewMatchIdx = -1;
let currentViewRow = null;
let viewEditing = false;
let viewEncoding = 'utf-8';

function setEditButtonsVisible(showEditEntry) {
    // showEditEntry=false：圖片或載入失敗時整組編輯/另存都不給用
    document.getElementById('viewModalEdit').style.display   = showEditEntry ? '' : 'none';
    document.getElementById('viewModalSaveAs').style.display = showEditEntry ? '' : 'none';
    document.getElementById('viewModalSave').style.display       = 'none';
    document.getElementById('viewModalCancelEdit').style.display = 'none';
}

function viewFile(idx) {
    const r = currentRows[idx];
    currentViewRow = r;
    viewEditing = false;
    const modalEl = document.getElementById('viewModal');
    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    document.getElementById('viewModalTitle').textContent = r.filename;
    document.getElementById('viewModalContent').innerHTML = '<p class="text-muted">載入中...</p>';
    document.getElementById('viewModalDownload').onclick = () => downloadFile(idx);
    document.getElementById('viewSearchBar').style.display = 'none';
    document.getElementById('viewSearchInput').value = '';
    document.getElementById('toolSidebar').style.display = 'none';
    setEditButtonsVisible(false);
    viewRawText = ''; viewMatches = []; viewMatchIdx = -1;
    modal.show();
    fetch('/api/cnc_program/view?relpath=' + encodeURIComponent(r.relpath))
        .then(r2 => r2.json())
        .then(json => {
            if (!json.success) {
                document.getElementById('viewModalContent').innerHTML = '<p class="text-danger">' + esc(json.error) + '</p>';
                return;
            }
            if (json.type === 'image') {
                document.getElementById('viewModalContent').innerHTML = '<img src="' + json.data + '">';
            } else {
                viewRawText = json.data;
                viewEncoding = json.encoding || 'utf-8';
                setEditButtonsVisible(true);
                viewLines = viewRawText.split('\n');
                document.getElementById('viewModalContent').innerHTML = '<div class="code-view" id="viewPre"></div>';
                renderViewLines('');
                renderToolSidebar(buildToolChanges(viewLines));
                document.getElementById('viewSearchBar').style.display = 'flex';
            }
        });
}

// ── 編輯 / 存檔 / 另存新檔 ──────────────────────────────────────────
// 這是實際控制機台的 NC 程式檔，存檔（覆寫）前後端一律先備份原檔到同層「已刪除」
// 資料夾（時間戳記檔名），改壞了還救得回來；另存新檔則完全不動原檔。
function toggleEditMode() {
    if (!currentViewRow || viewEditing) return;
    viewEditing = true;
    document.getElementById('viewModalEdit').style.display = 'none';
    document.getElementById('viewModalSaveAs').style.display = 'none';
    document.getElementById('viewModalSave').style.display = '';
    document.getElementById('viewModalCancelEdit').style.display = '';
    document.getElementById('viewSearchBar').style.display = 'none';
    document.getElementById('toolSidebar').style.display = 'none';
    document.getElementById('viewModalContent').innerHTML =
        '<textarea class="code-edit" id="viewEditArea" spellcheck="false"></textarea>';
    document.getElementById('viewEditArea').value = viewRawText;
    document.getElementById('viewEditArea').focus();
}

function cancelEditMode() {
    if (!viewEditing) return;
    viewEditing = false;
    document.getElementById('viewModalEdit').style.display = '';
    document.getElementById('viewModalSaveAs').style.display = '';
    document.getElementById('viewModalSave').style.display = 'none';
    document.getElementById('viewModalCancelEdit').style.display = 'none';
    document.getElementById('viewModalContent').innerHTML = '<div class="code-view" id="viewPre"></div>';
    viewLines = viewRawText.split('\n');
    renderViewLines('');
    renderToolSidebar(buildToolChanges(viewLines));
    document.getElementById('viewSearchBar').style.display = 'flex';
}

async function saveEditedFile() {
    if (!currentViewRow || !viewEditing) return;
    const btn = document.getElementById('viewModalSave');
    const content = document.getElementById('viewEditArea').value;
    btn.disabled = true;
    btn.textContent = '儲存中…';
    try {
        const resp = await fetch('/api/cnc_program/save', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ relpath: currentViewRow.relpath, content, encoding: viewEncoding })
        });
        const json = await resp.json();
        if (!json.success) { alert('儲存失敗：' + json.error); return; }
        viewRawText = content;
        cancelEditMode();
        alert('已儲存（原檔已自動備份於同層「已刪除」資料夾）');
    } catch (e) {
        alert('儲存失敗：' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = '💾 儲存';
    }
}

async function promptSaveAs() {
    if (!currentViewRow) return;
    const name = prompt('另存新檔名稱（存到同一個資料夾，不會動到原檔）：', currentViewRow.filename);
    if (!name || !name.trim()) return;
    const content = viewEditing ? document.getElementById('viewEditArea').value : viewRawText;
    try {
        const resp = await fetch('/api/cnc_program/save_as', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ relpath: currentViewRow.relpath, filename: name.trim(), content, encoding: viewEncoding })
        });
        const json = await resp.json();
        if (!json.success) { alert('另存新檔失敗：' + json.error); return; }
        alert('已另存為：' + json.filename);
        doSearch();
    } catch (e) {
        alert('另存新檔失敗：' + e.message);
    }
}

let viewLines = [];

// 解析換刀行：優先抓「T數字(說明)」這種帶尺寸註記的格式（如 M6T1(CD3)），
// 沒有說明文字時退而求其次抓 M06/T 搭配出現的純刀號（如 N1T1M06）
// 每把刀只記一次（在第一次出現換刀指令的那一行），給左側刀具清單跳轉用
// 排除像「58S」「7M58S」這種轉速/時間備註的雜訊（不是刀具尺寸），不在側欄顯示
const TOOL_DESC_NOISE_RE = /^\d*M?\d+S$/i;

function buildToolChanges(lines) {
    const reWithDesc = /T(\d+)\s*\(([^)]*)\)/i;
    const reBare1 = /M0?6\s*T(\d+)\b/i;
    const reBare2 = /\bT(\d+)\s*M0?6\b/i;
    const changes = [];
    lines.forEach((line, i) => {
        let m = line.match(reWithDesc);
        let tool = null, desc = '';
        if (m) {
            tool = m[1];
            desc = m[2].trim();
            if (TOOL_DESC_NOISE_RE.test(desc)) desc = '';
        } else {
            m = line.match(reBare1) || line.match(reBare2);
            if (m) tool = m[1];
        }
        if (tool !== null) {
            changes.push({line: i, label: 'T' + tool + (desc ? ' ' + desc : '')});
        }
    });
    return changes;
}

function renderToolSidebar(changes) {
    const sidebar = document.getElementById('toolSidebar');
    if (!changes.length) { sidebar.style.display = 'none'; sidebar.innerHTML = ''; return; }
    sidebar.style.display = 'block';
    sidebar.innerHTML = changes.map(c =>
        '<button class="tool-sidebar-item" onclick="jumpToCodeLine(' + c.line + ', this)">' + esc(c.label) + '</button>'
    ).join('');
}

function jumpToCodeLine(lineIdx, btnEl) {
    document.querySelectorAll('.tool-sidebar-item.active').forEach(b => b.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
    const el = document.getElementById('codeline-' + lineIdx);
    if (el) {
        el.scrollIntoView({block: 'center'});
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 900);
    }
}

function renderViewLines(q) {
    const container = document.getElementById('viewPre');
    const countEl = document.getElementById('viewSearchCount');
    if (!container) return;

    viewMatches = [];
    let matchN = 0;
    const lowerQ = q ? q.toLowerCase() : '';

    const html = viewLines.map((line, i) => {
        let codeHtml;
        if (!lowerQ) {
            codeHtml = esc(line) || ' ';
        } else {
            const lowerLine = line.toLowerCase();
            let pos = 0, idx = lowerLine.indexOf(lowerQ, 0), parts = '';
            while (idx !== -1) {
                parts += esc(line.slice(pos, idx));
                parts += '<mark id="vmatch-' + matchN + '">' + esc(line.slice(idx, idx + q.length)) + '</mark>';
                viewMatches.push(matchN);
                pos = idx + q.length;
                matchN++;
                idx = lowerLine.indexOf(lowerQ, pos);
            }
            parts += esc(line.slice(pos));
            codeHtml = parts || ' ';
        }
        return '<div class="code-line" id="codeline-' + i + '"><span class="code-content">' + codeHtml + '</span></div>';
    }).join('');
    container.innerHTML = html;

    if (!lowerQ) {
        viewMatchIdx = -1;
        countEl.textContent = '';
    } else if (viewMatches.length === 0) {
        viewMatchIdx = -1;
        countEl.textContent = '查無符合';
    } else {
        viewMatchIdx = 0;
        countEl.textContent = '1/' + viewMatches.length;
        goToViewMatch(0);
    }
}

function renderViewSearch(q) {
    renderViewLines(q.trim());
}

function goToViewMatch(n) {
    if (viewMatches.length === 0) return;
    const prevActive = document.querySelector('#viewPre mark.active');
    if (prevActive) prevActive.classList.remove('active');
    viewMatchIdx = (n + viewMatches.length) % viewMatches.length;
    const el = document.getElementById('vmatch-' + viewMatchIdx);
    if (el) {
        el.classList.add('active');
        el.scrollIntoView({block: 'center'});
    }
    document.getElementById('viewSearchCount').textContent = (viewMatchIdx + 1) + '/' + viewMatches.length;
}

document.getElementById('viewSearchInput').addEventListener('input', (e) => renderViewSearch(e.target.value.trim()));
document.getElementById('viewSearchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        if (viewMatches.length) goToViewMatch(viewMatchIdx + (e.shiftKey ? -1 : 1));
    }
});
document.getElementById('viewSearchNext').addEventListener('click', () => { if (viewMatches.length) goToViewMatch(viewMatchIdx + 1); });
document.getElementById('viewSearchPrev').addEventListener('click', () => { if (viewMatches.length) goToViewMatch(viewMatchIdx - 1); });

function downloadFile(idx) {
    const r = currentRows[idx];
    window.location.href = '/api/cnc_program/download?relpath=' + encodeURIComponent(r.relpath);
}

async function openFolder(idx) {
    const r = currentRows[idx];
    const resp = await fetch('/api/cnc_program/open_folder', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({relpath: r.relpath})
    });
    const json = await resp.json();
    if (!json.success) alert('開啟資料夾失敗：' + json.error);
}

async function deleteFile(idx) {
    const r = currentRows[idx];
    if (!confirm('確定要刪除「' + r.filename + '」嗎？\n（會移到同層的「已刪除」資料夾，不會真的消失）')) return;
    const pw = prompt('請輸入刪除密碼：');
    if (pw === null) return;
    if (pw !== 'maxclaw') { alert('密碼錯誤'); return; }
    const resp = await fetch('/api/cnc_program/delete', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({relpath: r.relpath})
    });
    const json = await resp.json();
    if (!json.success) { alert('刪除失敗：' + json.error); return; }
    doSearch();
}

let allMachines = [];   // 全廠所有已知機台名稱（不分機型，固定清單，下拉選用）

async function loadTree() {
    const resp = await fetch('/api/cnc_program/tree');
    const json = await resp.json();
    if (json.success) cncTree = json.tree;
    const dlTop = document.getElementById('dlTop');
    dlTop.innerHTML = Object.keys(cncTree).sort().map(t => '<option value="' + esc(t) + '">').join('');

    const machineSet = new Set();
    Object.values(cncTree).forEach(models => Object.values(models).forEach(ms => ms.forEach(m => machineSet.add(m))));
    allMachines = Array.from(machineSet).sort();
    const sel = document.getElementById('uploadMachine');
    sel.innerHTML = '<option value="">（不分機台）</option>' +
        allMachines.map(m => '<option value="' + esc(m) + '">' + esc(m) + '</option>').join('');
}

function refreshModelDatalist(topInputId) {
    const top = document.getElementById(topInputId).value.trim();
    const models = top && cncTree[top] ? Object.keys(cncTree[top]) : [];
    document.getElementById('dlModel').innerHTML = models.sort().map(m => '<option value="' + esc(m) + '">').join('');
}

// 機型品名不存在於系統內時，提示「會自動新增」，讓使用者放心直接上傳，不用先跑「新增範本」
function refreshUploadModelHint() {
    const hint = document.getElementById('uploadModelHint');
    const top = document.getElementById('uploadTop').value.trim();
    const model = document.getElementById('uploadModel').value.trim();
    if (!top || !model) {
        hint.textContent = '';
        hint.className = 'field-hint';
        return;
    }
    const exists = !!(cncTree[top] && cncTree[top][model]);
    if (exists) {
        hint.textContent = '✓ 已有此機型品名，會加進現有資料夾';
        hint.className = 'field-hint is-existing';
    } else {
        hint.textContent = '✦ 系統內查無此機型品名，上傳後會自動建立新資料夾';
        hint.className = 'field-hint is-new';
    }
}

document.getElementById('uploadTop').addEventListener('input', () => { refreshModelDatalist('uploadTop'); refreshUploadModelHint(); });
document.getElementById('uploadModel').addEventListener('input', refreshUploadModelHint);
document.getElementById('newModelTop').addEventListener('input', () => refreshModelDatalist('newModelTop'));

document.getElementById('btnSearch').addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

let _cncRebuildTimer = null;

document.getElementById('btnRebuild').addEventListener('click', async () => {
    const btn  = document.getElementById('btnRebuild');
    const wrap = document.getElementById('cncRebuildWrap');
    const pctEl = document.getElementById('cncRebuildPct');
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '重建中...';
    wrap.style.display = '';
    pctEl.textContent = '啟動中…';
    pctEl.className = 'cnc-progress-pct';
    try {
        const resp = await fetch('/api/cnc_program/rebuild', {method:'POST'});
        const json = await resp.json();
        if (!json.success) throw new Error(json.error);
        _cncRebuildTimer = setInterval(pollCncRebuildStatus, 1000);
    } catch (e) {
        cncRebuildFail(e.message || String(e));
    }
});

async function pollCncRebuildStatus() {
    const btn  = document.getElementById('btnRebuild');
    const wrap = document.getElementById('cncRebuildWrap');
    const pctEl = document.getElementById('cncRebuildPct');
    try {
        const resp = await fetch('/api/cnc_program/rebuild/status');
        const s = await resp.json();
        if (s.phase === 'scanning') {
            pctEl.textContent = s.count > 0 ? '已索引 ' + s.count.toLocaleString() + ' 筆…' : '掃描中…';
        } else if (s.phase === 'done') {
            clearInterval(_cncRebuildTimer); _cncRebuildTimer = null;
            wrap.style.display = 'none';
            btn.disabled = false;
            btn.textContent = '↻ 重建索引';
            await loadTree();
            doSearch();
            alert('重建完成，共索引 ' + s.count + ' 筆檔案');
        } else if (s.phase === 'error') {
            clearInterval(_cncRebuildTimer); _cncRebuildTimer = null;
            cncRebuildFail(s.error || '未知錯誤');
        }
    } catch (e) {
        // 網路短暫中斷，繼續輪詢
    }
}

function cncRebuildFail(msg) {
    if (_cncRebuildTimer) { clearInterval(_cncRebuildTimer); _cncRebuildTimer = null; }
    const btn  = document.getElementById('btnRebuild');
    const wrap = document.getElementById('cncRebuildWrap');
    wrap.style.display = 'none';
    btn.disabled = false;
    btn.textContent = '↻ 重建索引';
    alert('重建失敗：' + msg);
}

function resetFilePicker() {
    document.getElementById('uploadFile').value = '';
    const t = document.getElementById('filePickerText');
    t.textContent = '點擊選擇檔案，或拖曳到此處';
    t.classList.remove('has-file');
}

document.getElementById('uploadFile').addEventListener('change', (e) => {
    const t = document.getElementById('filePickerText');
    if (e.target.files.length) {
        t.textContent = e.target.files[0].name;
        t.classList.add('has-file');
    } else {
        resetFilePicker();
    }
});

const filePickerLabel = document.getElementById('filePickerLabel');
['dragenter', 'dragover'].forEach(evt => filePickerLabel.addEventListener(evt, (e) => {
    e.preventDefault();
    filePickerLabel.classList.add('drag-over');
}));
['dragleave', 'drop'].forEach(evt => filePickerLabel.addEventListener(evt, (e) => {
    e.preventDefault();
    filePickerLabel.classList.remove('drag-over');
}));
filePickerLabel.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files.length) {
        document.getElementById('uploadFile').files = files;
        document.getElementById('uploadFile').dispatchEvent(new Event('change'));
    }
});

document.getElementById('btnUpload').addEventListener('click', () => {
    document.getElementById('uploadError').style.display = 'none';
    document.getElementById('uploadTop').value = '';
    document.getElementById('uploadModel').value = '';
    document.getElementById('uploadMachine').value = '';
    document.getElementById('uploadModelHint').textContent = '';
    document.getElementById('uploadModelHint').className = 'field-hint';
    resetFilePicker();
    bootstrap.Modal.getOrCreateInstance(document.getElementById('uploadModal')).show();
});

document.getElementById('btnUploadSubmit').addEventListener('click', async () => {
    const top = document.getElementById('uploadTop').value.trim();
    const model = document.getElementById('uploadModel').value.trim();
    const machine = document.getElementById('uploadMachine').value.trim();
    const fileInput = document.getElementById('uploadFile');
    const errBox = document.getElementById('uploadError');
    errBox.style.display = 'none';

    if (!top || !model || !fileInput.files.length) {
        errBox.textContent = '請填寫系列、機型品名並選擇檔案';
        errBox.style.display = 'block';
        return;
    }
    const fd = new FormData();
    fd.append('top_folder', top);
    fd.append('model', model);
    fd.append('machine', machine);
    fd.append('file', fileInput.files[0]);

    try {
        const resp = await fetch('/api/cnc_program/upload', {method:'POST', body: fd});
        const json = await resp.json();
        if (!json.success) {
            errBox.textContent = json.error;
            errBox.style.display = 'block';
            return;
        }
        bootstrap.Modal.getOrCreateInstance(document.getElementById('uploadModal')).hide();
        await loadTree();
        doSearch();
    } catch (e) {
        errBox.textContent = '上傳失敗：' + e;
        errBox.style.display = 'block';
    }
});

document.getElementById('btnNewModel').addEventListener('click', () => {
    document.getElementById('newModelError').style.display = 'none';
    document.getElementById('newModelTop').value = '';
    document.getElementById('newModelName').value = '';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('newModelModal')).show();
});

document.getElementById('btnNewModelSubmit').addEventListener('click', async () => {
    const top = document.getElementById('newModelTop').value.trim();
    const model = document.getElementById('newModelName').value.trim();
    const errBox = document.getElementById('newModelError');
    errBox.style.display = 'none';

    if (!top || !model) {
        errBox.textContent = '請填寫系列與新機型品名';
        errBox.style.display = 'block';
        return;
    }
    try {
        const resp = await fetch('/api/cnc_program/new_model', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({top_folder: top, model: model})
        });
        const json = await resp.json();
        if (!json.success) {
            errBox.textContent = json.error;
            errBox.style.display = 'block';
            return;
        }
        bootstrap.Modal.getOrCreateInstance(document.getElementById('newModelModal')).hide();
        await loadTree();
        alert('已建立資料夾，現在可以用「上傳程式」把檔案放進去了');
    } catch (e) {
        errBox.textContent = '建立失敗：' + e;
        errBox.style.display = 'block';
    }
});

loadTree();
doSearch();
</script>
</body>
</html>
