<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加工部查詢系統PDS - 設備稼動</title>
<link rel="icon" type="image/png" href="/static/app-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   Dark Equipment Monitor — ServCloud Style
═══════════════════════════════════════ */
:root {
  --blue:    #1565C0;
  --blue-d:  #0D47A1;
  --blue-l:  #1976D2;
  --blue-bg: #E3F2FD;
  --border:  #B0BEC5;
  --bg:      #CFD8DC;
  /* Claude-style warm chart palette */
  --dk-bg:   #FFFFFF;
  --dk-row0: #FFFFFF;
  --dk-row1: #FAF9F5;
  --dk-lbl:  #F0EDE4;
  --dk-bdr:  #E5E4DF;
  --dk-text: #3D3D3A;
  --dk-text2:#8A8778;
  --accent:  #D97757;
  --run:  #4CA776;
  --idle: #F5A623;
  --alrm: #C0392B;
  --off:  #E8E6DF;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body,*{font-family:'Noto Sans TC', 'Source Han Sans TC', sans-serif}
body{font-size:13px;background:var(--bg);color:#212121}

/* ── ERP Header ── */
.header{background:#1565C0;color:#fff;
  position:sticky;top:0;z-index:200;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.header-inner{display:flex;align-items:flex-end;padding:.4rem 1rem 0}
.header-logo{margin-left:auto;align-self:center;font-size:1.15rem;font-weight:800;font-style:italic;letter-spacing:.03em;color:#F5A623}
.header-title{font-size:1.1rem;font-weight:700;padding-bottom:.45rem;white-space:nowrap;margin-right:.5rem}
.header-tabs{display:flex;align-items:flex-end;gap:2px}
.header-tab{display:inline-block;padding:.3rem .75rem;font-size:1rem;font-weight:600;white-space:nowrap;
  color:rgba(255,255,255,.85);text-decoration:none;border-radius:0;
  background:rgba(255,255,255,.15);cursor:pointer;transition:background .15s}
.header-tab.active,.header-tab:hover{background:#fff;color:var(--blue-d)}


        .header-tab-mgmt{background:#06C755;color:#fff}
        .header-tab-mgmt.active,.header-tab-mgmt:hover{background:#05A649;color:#fff}
        .header-tab-zumen{background:#4FC3F7;color:#fff;letter-spacing:.06em}
        .header-tab-zumen.active,.header-tab-zumen:hover{background:#039BE5;color:#fff}/* ── Toolbar ── */
.toolbar{background:#fff;border-bottom:2px solid var(--blue);
  padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.toolbar label{font-weight:700;font-size:13px;color:#333;white-space:nowrap}
.toolbar input[type=date],.toolbar select{
  padding:4px 8px;border:2px solid var(--border);border-radius:4px;
  font-size:13px;background:#fff;color:#212121}
.toolbar input[type=date]:focus,.toolbar select:focus{border-color:var(--blue);outline:none}
.t-sep{width:1px;height:24px;background:#e0e0e0}

/* machine dropdown */
.ms-wrap{position:relative}
.ms-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;
  border:2px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;
  font-size:13px;min-width:130px;user-select:none;transition:border-color .15s}
.ms-btn:hover,.ms-btn.open{border-color:var(--blue)}
.ms-btn .caret{margin-left:auto;font-size:10px;color:#546E7A;transition:transform .2s}
.ms-btn.open .caret{transform:rotate(180deg)}
.ms-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:600;
  background:#fff;border:2px solid var(--blue);border-radius:4px;
  box-shadow:0 6px 20px rgba(0,0,0,.15);min-width:180px;max-height:360px;overflow-y:auto}
.ms-wrap.open .ms-dropdown{display:block}
.ms-ddhdr{display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px;border-bottom:1px solid #e0e0e0;background:var(--blue-bg);
  position:sticky;top:0}
.ms-ddhdr span{font-weight:700;font-size:12px;color:var(--blue-d)}
.ms-ddhdr-btns{display:flex;gap:6px}
.ms-ddhdr-btns button{padding:2px 8px;border-radius:3px;border:1px solid var(--border);
  font-size:11px;cursor:pointer;background:#fff;color:#546E7A;transition:all .15s}
.ms-ddhdr-btns button:hover{border-color:var(--blue);color:var(--blue)}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;transition:background .12s}
.ms-opt:hover{background:var(--blue-bg)}
.ms-opt input[type=checkbox]{width:14px;height:14px;accent-color:var(--blue);cursor:pointer}

.btn-query{padding:5px 20px;border:none;border-radius:4px;background:var(--blue);color:#fff;
  font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;
  gap:6px;transition:background .15s}
.btn-query:hover{background:var(--blue-d)}

/* ── Content ── */
.content{padding:10px 12px}

/* ── Claude-style Chart Card ── */
.chart-card{border-radius:10px;overflow:hidden;
  border:1px solid var(--dk-bdr);box-shadow:0 2px 10px rgba(61,57,41,.08)}
.chart-card-hdr{
  background:linear-gradient(90deg,#FAF9F5 0%,#F4F1E8 100%);
  color:#3D3929;padding:9px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--dk-bdr)}
.chart-card-hdr h3{font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:8px}
.chart-info{font-size:11px;color:var(--dk-text2)}

/* Legend */
.legend-bar{display:flex;align-items:center;gap:16px;padding:7px 14px;
  background:#FAF9F5;border-bottom:1px solid var(--dk-bdr)}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dk-text2)}
.leg-dot{width:14px;height:10px;border-radius:2px;flex-shrink:0}
.update-time{margin-left:auto;font-size:11px;color:var(--dk-text2)}

/* Chart scroll */
.chart-scroll{overflow-x:auto;background:var(--dk-bg)}

/* states */
.state-box{padding:60px 20px;text-align:center;color:var(--dk-text2);
  font-size:14px;line-height:2;background:var(--dk-bg)}
.spinner{display:inline-block;width:22px;height:22px;
  border:3px solid var(--dk-bdr);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Tooltip */
#tip{position:fixed;pointer-events:none;z-index:9999;
  background:#FFFFFF;color:#3D3D3A;font-size:12px;
  padding:9px 13px;border-radius:8px;display:none;white-space:nowrap;
  line-height:2;box-shadow:0 6px 20px rgba(61,57,41,.18);
  border:1px solid var(--dk-bdr)}
#tip .tt{font-weight:700;font-size:13px;color:var(--accent);margin-bottom:2px}
.seg{cursor:pointer}
.seg:hover{filter:brightness(.92)}
</style>

<div class="header">
  <div class="header-inner">

    <div class="header-tabs">
      <a href="/"           class="header-tab">製令查詢</a>
      <a href="/production" class="header-tab">生產中製令</a>
      <span                 class="header-tab active">設備稼動</span>
      <a href="/drawing"    class="header-tab">PDM圖面查詢</a>
      <a href="/routing"        class="header-tab">產品途程查詢</a>

<!-- ── Toolbar ── -->
<div class="toolbar">
  <label>日期</label>
  <input type="date" id="fDate">
  <div class="t-sep"></div>
  <label>時間</label>
  <select id="fSH"></select>

  <select id="fEH"></select>
  <div class="t-sep"></div>
  <label>機台</label>
  <div class="ms-wrap" id="msWrap">
    <div class="ms-btn" id="msBtn" onclick="toggleMs()">

    </div>
    <div class="ms-dropdown" id="msDrop">

          <button onclick="msAll();event.stopPropagation()">全選</button>

      </div>

  </div>
  <div class="t-sep"></div>
  <button class="btn-query" onclick="doQuery()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>查詢
  </button>
</div>

<!-- ── Content ── -->
<div class="content">
  <div class="chart-card">
    <div class="chart-card-hdr">
      <h3>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#D97757" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        機台狀態歷史堆疊圖
      </h3>
      <div class="chart-info" id="chartInfo">— 請設定條件後查詢 —</div>
    </div>
    <div class="legend-bar">
      <div class="leg"><div class="leg-dot" style="background:#4CA776"></div>運轉</div>
      <div class="leg"><div class="leg-dot" style="background:#F5A623"></div>待機</div>
      <div class="leg"><div class="leg-dot" style="background:#C0392B"></div>警報</div>
      <div class="leg"><div class="leg-dot" style="background:#E8E6DF;border:1px solid #DDD9CD"></div>離線</div>
      <div class="update-time" id="updTime"></div>
    </div>
    <div class="chart-scroll">
      <div id="chartBody">
        <div class="state-box">請選擇日期、時間與機台後按「查詢」</div>
      </div>
    </div>
  </div>
</div>

<div id="tip"><div class="tt" id="ttTitle"></div><div id="ttBody"></div></div>

<script>
/* ── Config ── */
const LBL_W   = 120;  // left label column
const STAT_W  = 110;  // right stats column (wider for seconds)
const ROW_H   = 50;
const AXIS_H  = 30;
const CHART_W = 1060;
const STATUS  = {
  '0':['離線','#E8E6DF'],'11':['運轉','#4CA776'],
  '12':['待機','#F5A623'],'13':['警報','#C0392B'],'B':['離線','#E8E6DF']
};

let allMachines=[], checkedIds=new Set();

/* ── Init ── */
(function(){
  const t=new Date(), p=n=>String(n).padStart(2,'0');
  document.getElementById('fDate').value=`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
  const sh=document.getElementById('fSH'), eh=document.getElementById('fEH');
  for(let h=8;h<=21;h++){ sh.add(new Option(`${p(h)}:00`,h)); eh.add(new Option(`${p(h)}:00`,h)); }
  sh.value=8; eh.value=18;
  loadMachines();
  document.addEventListener('click',e=>{ if(!document.getElementById('msWrap').contains(e.target)) closeMs(); });
})();

/* ── Multi-select ── */
function toggleMs(){
  const w=document.getElementById('msWrap'),b=document.getElementById('msBtn');
  const op=w.classList.toggle('open'); b.classList.toggle('open',op);
}
function closeMs(){
  document.getElementById('msWrap').classList.remove('open');
  document.getElementById('msBtn').classList.remove('open');
}
function updLabel(){
  const n=checkedIds.size,tot=allMachines.length;
  document.getElementById('msBtnLabel').textContent=n===0?'請選擇機台':n===tot?`全部 (${n} 台)`:`已選 ${n}/${tot} 台`;
  document.getElementById('msCount').textContent=`${n} 台已選`;
}
function buildOpts(){
  document.getElementById('msOpts').innerHTML=allMachines.map(m=>`
    <label class="ms-opt">
      <input type="checkbox" value="${m.device_id}" ${checkedIds.has(m.device_id)?'checked':''}
        onchange="togCheck(this,'${m.device_id}')">
      <span>${m.device_name}</span>
    </label>`).join('');
}
function togCheck(el,id){ if(el.checked) checkedIds.add(id); else checkedIds.delete(id); updLabel(); }
function msAll(){ allMachines.forEach(m=>checkedIds.add(m.device_id)); buildOpts(); updLabel(); }
function msNone(){ checkedIds.clear(); buildOpts(); updLabel(); }

async function loadMachines(){
  try{
    const j=await (await fetch('/api/equipment/machines')).json();
    if(!j.success) throw new Error(j.error);
    allMachines=j.data; msNone(); buildOpts(); updLabel();
  }catch(e){
    document.getElementById('msBtnLabel').textContent='載入失敗';
    document.getElementById('msOpts').innerHTML=`<div style="padding:10px;color:#F44336">${e.message}</div>`;
  }
}

/* ── Query ── */
async function doQuery(){
  const date=document.getElementById('fDate').value;
  const sh=parseInt(document.getElementById('fSH').value);
  const eh=parseInt(document.getElementById('fEH').value);
  const ids=[...checkedIds];
  if(!date){alert('請選擇日期');return;}
  if(sh>=eh){alert('結束時間必須大於開始時間');return;}
  if(!ids.length){alert('請至少選擇一台機台');return;}
  closeMs();
  document.getElementById('chartBody').innerHTML=
    `<div class="state-box"><span class="spinner"></span>&nbsp;查詢中，請稍候…</div>`;
  document.getElementById('chartInfo').textContent='載入中…';
  try{
    const qs=ids.map(id=>`machines=${encodeURIComponent(id)}`).join('&');
    const j=await (await fetch(`/api/equipment/history?date=${date}&start_hour=${sh}&end_hour=${eh}&${qs}`)).json();
    if(!j.success) throw new Error(j.error||JSON.stringify(j));
    renderChart(j);
    document.getElementById('updTime').textContent='更新：'+new Date().toLocaleTimeString('zh-TW');
  }catch(e){
    document.getElementById('chartBody').innerHTML=
      `<div class="state-box" style="color:#F44336">⚠ 查詢失敗：${e.message}</div>`;
  }
}

/* ── IQR robust average — 用於待機時間 (operates on seconds) ── */
function robustAvg(vals){
  if(!vals.length) return null;
  const s=[...vals].sort((a,b)=>a-b);
  const q1=s[Math.floor(s.length*.25)], q3=s[Math.floor(s.length*.75)];
  const iqr=q3-q1, lo=q1-1.5*iqr, hi=q3+1.5*iqr;
  const ok=s.filter(v=>v>=lo&&v<=hi);
  return ok.length ? Math.round(ok.reduce((a,b)=>a+b,0)/ok.length) : null;
}
/* ── 眾數平均 — 用於運轉時間：先分 60 秒 bin 找眾數，再取眾數 bin ±1 的均值 ── */
function modeAvg(vals){
  if(!vals.length) return null;
  if(vals.length===1) return Math.round(vals[0]);
  const BIN=60;
  const bins={};
  vals.forEach(v=>{ const k=Math.floor(v/BIN); (bins[k]=bins[k]||[]).push(v); });
  let maxCnt=0, modeKey=0;
  Object.entries(bins).forEach(([k,arr])=>{ if(arr.length>maxCnt){maxCnt=arr.length;modeKey=+k;} });
  const nearby=[];
  [-1,0,1].forEach(d=>{ if(bins[modeKey+d]) nearby.push(...bins[modeKey+d]); });
  return Math.round(nearby.reduce((a,b)=>a+b,0)/nearby.length);
}
/* Format seconds → "Xh Ym Zs" / "Xm Ys" / "Xs" */
function fmtSec(s){
  if(s===null) return '—';
  if(s<1)  return '<1s';
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(h>0)  return `${h}h ${m}m ${sec}s`;
  if(m>0)  return `${m}m ${sec}s`;
  return `${sec}s`;
}

/* ── Render Claude-style SVG chart ── */
function renderChart(data){
  const {machines,start_hour,end_hour,total_minutes,date}=data;
  if(!machines?.length){
    document.getElementById('chartBody').innerHTML='<div class="state-box">無資料</div>';
    return;
  }
  const hCount=end_hour-start_hour;
  const FOOTER=38;
  const svgH=AXIS_H+machines.length*ROW_H+FOOTER;
  const svgW=LBL_W+CHART_W+STAT_W;
  const ppm=CHART_W/total_minutes;
  const xStat=LBL_W+CHART_W;

  let s=''; // svg content

  /* ── background fill ── */
  s+=`<rect width="${svgW}" height="${svgH}" fill="#FFFFFF"/>`;

  /* ── Axis header ── */
  s+=`<rect x="0" y="0" width="${svgW}" height="${AXIS_H}" fill="#FAF9F5"/>`;
  s+=`<rect x="0" y="0" width="${LBL_W}" height="${AXIS_H}" fill="#F0EDE4"/>`;
  s+=`<text x="${LBL_W/2}" y="${AXIS_H/2+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#D97757">機台 / 稼動</text>`;
  /* stat col header */
  s+=`<rect x="${xStat}" y="0" width="${STAT_W}" height="${AXIS_H}" fill="#F0EDE4"/>`;
  s+=`<text x="${xStat+STAT_W/2}" y="${AXIS_H/2-3}" text-anchor="middle" font-size="10" fill="#4CA776">▶ 平均運轉</text>`;
  s+=`<text x="${xStat+STAT_W/2}" y="${AXIS_H/2+10}" text-anchor="middle" font-size="10" fill="#F5A623">⏸ 平均待機</text>`;
  /* hour labels */
  for(let i=0;i<=hCount;i++){
    const x=LBL_W+i*(CHART_W/hCount);
    const hr=start_hour+i;
    const lbl=(hr<12?hr+'AM':hr===12?'12PM':hr===24?'12AM':(hr-12)+'PM');
    s+=`<line x1="${x}" y1="0" x2="${x}" y2="${svgH}" stroke="#ECE9DE" stroke-width="1"/>`;
    s+=`<text x="${x}" y="${AXIS_H-6}" text-anchor="middle" font-size="10" fill="#8A8778">${lbl}</text>`;
  }
  /* 30-min sub-ticks */
  for(let i=1;i<hCount*2;i+=2){
    const x=LBL_W+i*(CHART_W/(hCount*2));
    s+=`<line x1="${x}" y1="${AXIS_H}" x2="${x}" y2="${svgH}" stroke="#F5F4ED" stroke-width="0.8"/>`;
  }
  /* dividers */
  s+=`<line x1="${LBL_W}" y1="0" x2="${LBL_W}" y2="${svgH}" stroke="#E5E4DF" stroke-width="1.2"/>`;
  s+=`<line x1="${xStat}" y1="0" x2="${xStat}" y2="${svgH}" stroke="#E5E4DF" stroke-width="1"/>`;

  /* ── Rows ── */
  const allRun=[], allIdle=[];
  machines.forEach((mac,ri)=>{
    const y0=AXIS_H+ri*ROW_H;
    const bg=ri%2===0?'#FFFFFF':'#FAF9F5';  // 奇偶對比
    s+=`<rect x="0" y="${y0}" width="${svgW}" height="${ROW_H}" fill="${bg}"/>`;
    /* 每列底部分隔線 */
    s+=`<line x1="0" y1="${y0+ROW_H-1}" x2="${svgW}" y2="${y0+ROW_H-1}" stroke="#ECE9DE" stroke-width="1.5"/>`;
    s+=`<line x1="${LBL_W}" y1="${y0+ROW_H}" x2="${svgW}" y2="${y0+ROW_H}" stroke="#ECE9DE" stroke-width="0.8"/>`;

    /* label col */
    s+=`<rect x="0" y="${y0}" width="${LBL_W}" height="${ROW_H}" fill="#F0EDE4"/>`;
    s+=`<line x1="${LBL_W-1}" y1="${y0}" x2="${LBL_W-1}" y2="${y0+ROW_H}" stroke="#E5E4DF" stroke-width="1.2"/>`;

    /* calc utilisation + IQR stats (秒) */
    const runDurs=[], idleDurs=[];
    (mac.segments||[]).forEach(seg=>{
      if(seg.status==='11') runDurs.push(seg.dur_sec);
      if(seg.status==='12') idleDurs.push(seg.dur_sec);
    });
    const totalRunS=runDurs.reduce((a,b)=>a+b,0);
    const util=Math.round(totalRunS/(total_minutes*60)*100);
    const avgR=modeAvg(runDurs), avgI=robustAvg(idleDurs);
    allRun.push(...runDurs); allIdle.push(...idleDurs);

    /* utilisation colour */
    const uc=util>=70?'#4CA776':util>=40?'#F5A623':'#C0392B';

    /* machine name + util% */
    s+=`<text x="${LBL_W-8}" y="${y0+18}" text-anchor="end" font-size="13" font-weight="700" fill="#3D3D3A">${esc(mac.name)}</text>`;
    s+=`<text x="${LBL_W-8}" y="${y0+35}" text-anchor="end" font-size="12" font-weight="700" fill="${uc}">${util}%</text>`;

    /* segments — full height, no padding */
    (mac.segments||[]).forEach(seg=>{
      const sx=LBL_W+seg.start_min*ppm;
      const sw=Math.max(1,( seg.end_min-seg.start_min)*ppm);
      const [sn,sc]=STATUS[seg.status]||['未知','#E8E6DF'];
      const tj=JSON.stringify({nm:mac.name,st:sn,s:seg.start_str,e:seg.end_str,d:seg.dur_sec})
                 .replace(/"/g,'&quot;');
      s+=`<rect x="${sx.toFixed(1)}" y="${y0+2}" width="${sw.toFixed(1)}" height="${ROW_H-4}"
        fill="${sc}" class="seg" data-t="${tj}"
        onmouseenter="sTip(event,this)" onmouseleave="hTip()"/>`;
    });

    /* stat cell */
    s+=`<rect x="${xStat}" y="${y0}" width="${STAT_W}" height="${ROW_H}" fill="${bg}"/>`;
    s+=`<text x="${xStat+STAT_W/2}" y="${y0+19}" text-anchor="middle" font-size="13" font-weight="700" fill="#4CA776">${fmtSec(avgR)}</text>`;
    s+=`<text x="${xStat+STAT_W/2}" y="${y0+36}" text-anchor="middle" font-size="13" font-weight="700" fill="#F5A623">${fmtSec(avgI)}</text>`;
  });

  /* ── Footer ── */
  const yF=AXIS_H+machines.length*ROW_H;
  const gR=modeAvg(allRun), gI=robustAvg(allIdle);
  s+=`<rect x="0" y="${yF}" width="${svgW}" height="${FOOTER}" fill="#F0EDE4"/>`;
  s+=`<line x1="0" y1="${yF}" x2="${svgW}" y2="${yF}" stroke="#D97757" stroke-width="1.2"/>`;
  s+=`<rect x="0" y="${yF}" width="${LBL_W}" height="${FOOTER}" fill="#F0EDE4"/>`;
  s+=`<text x="${LBL_W-8}" y="${yF+FOOTER/2+4}" text-anchor="end" font-size="11" font-weight="700" fill="#D97757">全體平均</text>`;
  s+=`<text x="${xStat+STAT_W/2}" y="${yF+16}" text-anchor="middle" font-size="13" font-weight="800" fill="#4CA776">${fmtSec(gR)}</text>`;
  s+=`<text x="${xStat+STAT_W/2}" y="${yF+31}" text-anchor="middle" font-size="13" font-weight="800" fill="#F5A623">${fmtSec(gI)}</text>`;
  s+=`<text x="${LBL_W+8}" y="${yF+FOOTER-6}" font-size="9" fill="#ABA89C">* 運轉均值＝眾數bin±1均值；待機均值已排除 IQR×1.5 異常值</text>`;

  document.getElementById('chartInfo').textContent=
    `${date}  ${String(start_hour).padStart(2,'0')}:00 ～ ${String(end_hour).padStart(2,'0')}:00　${machines.length} 台`;

  document.getElementById('chartBody').innerHTML=
    `<svg xmlns="http://www.w3.org/2000/svg" width="${svgW}" height="${svgH}"
      style="display:block;min-width:${svgW}px">${s}</svg>`;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Tooltip ── */
const tip=document.getElementById('tip');
function sTip(e,el){
  const d=JSON.parse(el.dataset.t.replace(/&quot;/g,'"'));
  document.getElementById('ttTitle').textContent=d.nm;
  document.getElementById('ttBody').innerHTML=`狀態：${d.st}<br>時間：${d.s} ～ ${d.e}<br>時長：${fmtSec(d.d)}`;
  tip.style.display='block'; mv(e);
}
function hTip(){ tip.style.display='none'; }
function mv(e){ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px'; }
document.addEventListener('mousemove',e=>{ if(tip.style.display!=='none') mv(e); });
</script>
</body>
