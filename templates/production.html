<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加工部查詢系統PDS - 生產中製令</title>
    <link rel="icon" type="image/png" href="/static/app-icon.png">
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ══════════════════════════════════════════
           現代 SaaS 卡片風 — Production Monitor
           （跟管理頁「採購登入表／頻率」同一套：淺灰底 + 白卡片 + 深藍灰表頭）
           ══════════════════════════════════════════ */
        :root {
            --pd-bg:      #F1F5F9;
            --pd-card:    #FFFFFF;
            --pd-border:  #E2E8F0;
            --pd-text:    #1E293B;
            --pd-text2:   #64748B;
            --pd-accent:  #1565C0;
            --pd-accent-d:#0D47A1;
            --pd-th-bg:   #37474F;
            --pd-row-alt: #FAFBFC;
            --pd-hover:   #EFF6FF;
            --pd-success: #16A34A;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, * {
            font-family: 'Noto Sans TC', 'Source Han Sans TC', sans-serif;
        }
        html, body { height: 100%; }
        body {
            font-size: 12.5px;
            background: var(--pd-bg);
            color: var(--pd-text);
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }

        /* ── Header ── */
        .header {
            background: #1565C0;
            color: white; padding: 0;
            flex: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .header-inner { display: flex; align-items: flex-end; padding: 0.4rem 1rem 0; }
        .header-logo { margin-left:auto; align-self:center; font-size:1.15rem; font-weight:800; font-style:italic; letter-spacing:.03em; color:#F5A623; }
        .header-title{font-size:1.1rem;font-weight:700;padding-bottom:.45rem;white-space:nowrap;margin-right:.5rem}
        .header-tabs{display:flex;align-items:flex-end;gap:2px}
        .header-tab{display:inline-block;padding:.3rem .75rem;font-size:1rem;font-weight:600;white-space:nowrap;
          color:rgba(255,255,255,.85);text-decoration:none;border-radius:0;
          background:rgba(255,255,255,.15);cursor:pointer;transition:background .15s}
        .header-tab.active,.header-tab:hover{background:#fff;color:#1565C0}


        .header-tab-mgmt{background:#06C755;color:#fff}
        .header-tab-mgmt.active,.header-tab-mgmt:hover{background:#05A649;color:#fff}
        .header-tab-zumen{background:#4FC3F7;color:#fff;letter-spacing:.06em}
        .header-tab-zumen.active,.header-tab-zumen:hover{background:#039BE5;color:#fff}/* ── Toolbar ── */
        .toolbar-wrap {
            background: var(--pd-card);
            border-bottom: 1px solid var(--pd-border);
            padding: 8px 12px;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            flex: none;
        }
        .toolbar-wrap label { font-weight: 700; font-size: 13px; color: var(--pd-text); }
        .toolbar-wrap select {
            padding: 4px 10px; border: 1px solid var(--pd-border); border-radius: 6px;
            font-size: 13px; font-weight: 600; min-width: 80px;
            background: var(--pd-card); color: var(--pd-text);
        }
        .toolbar-wrap select:focus { border-color: var(--pd-accent); outline: none; }
        .btn-erp {
            padding: 5px 18px; border: none; border-radius: 6px;
            font-weight: 700; cursor: pointer; font-size: 13px; color: white;
            display: inline-flex; align-items: center; gap: 4px;
            transition: background .15s;
        }
        .btn-erp-blue { background: var(--pd-accent); }
        .btn-erp-blue:hover { background: var(--pd-accent-d); }
        .toolbar-info {
            margin-left: auto; font-size: 12px; color: var(--pd-text2);
        }
        .toolbar-info b { color: var(--pd-accent); font-size: 14px; }
        .toolbar-info .update-time { color: var(--pd-text2); margin-left: 10px; }

        /* ── Table ── */
        .table-container {
            margin: 12px;
            background: var(--pd-card);
            border: none;
            border-radius: 12px;
            overflow: auto;
            box-shadow: 0 1px 8px rgba(0,0,0,.07);
            flex: 1 1 auto;
            min-height: 0;
        }
        table {
            width: 100%; border-collapse: collapse;
            font-size: 12px; white-space: nowrap;
        }
        thead th {
            background: var(--pd-th-bg);
            color: #fff;
            font-weight: 700; font-size: 11px;
            padding: 7px 10px;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,.08);
            text-align: center;
            position: sticky; top: 0; z-index: 10;
            cursor: pointer; user-select: none;
            line-height: 1.3;
        }
        thead th:hover { background: #455A64; }
        /* 放大標題列文字（蓋過 pds-ibm.css 的 12px，僅本頁生效） */
        .table-container thead th { font-size: 13px; }
        thead th.sorted-asc::after { content: ' \25B2'; font-size: 9px; color: #90CAF9; }
        thead th.sorted-desc::after { content: ' \25BC'; font-size: 9px; color: #90CAF9; }

        tbody td {
            padding: 5px 10px;
            border: none;
            border-bottom: 1px solid var(--pd-border);
            vertical-align: middle;
        }
        tbody tr:nth-child(even) { background: var(--pd-row-alt); }
        tbody tr:hover td { background: var(--pd-hover) !important; }

        /* ── 數值欄 ── */
        .cell-num { text-align: right; font-family: Consolas, 'Courier New', monospace; font-weight: 600; }
        .cell-center { text-align: center; }

        /* ── 生產狀況：淺底深字徽章（跟採購登入表狀態徽章同款） ── */
        .st-producing, .st-paused, .st-other {
            display: inline-block; height: 24px; line-height: 24px; padding: 0 12px;
            border-radius: 12px; font-weight: 700; font-size: 13px;
        }
        .st-producing { background: #DCFCE7; color: #15803D; }
        .st-paused { background: #FEE2E2; color: #B91C1C; }
        .st-other { background: #FEF3C7; color: #B45309; }

        /* ── 即時生產量：DATAVIZ 資料條（即時/預計 百分比，依完成率分級上色：紅→橙→綠） ── */
        .rt-zero { color: var(--pd-text2); font-weight: 700; font-family: Consolas, monospace; }
        .rt-wrap { display: flex; align-items: center; justify-content: flex-start; gap: 6px; }
        .rt-track { position: relative; display: block; flex: none; width: 34px; height: 16px; background: #E5EAF0; overflow: hidden; }
        .rt-fill {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            transform: scaleX(0); transform-origin: left center;
        }
        .rt-fill.rt-fill-low  { background: linear-gradient(90deg, #B91C1C, #EF4444); }  /* <70%：紅 */
        .rt-fill.rt-fill-mid  { background: linear-gradient(90deg, #B45309, #F59E0B); }  /* 70~90%：橙 */
        .rt-fill.rt-fill-high { background: linear-gradient(90deg, #15803D, #4ADE80); }  /* ≥90%：綠 */
        .rt-fill.rt-fill-full { background: linear-gradient(90deg, #15803D, #22C55E); }  /* ≥100%：達標飽和綠 */
        .rt-num { font-family: Consolas, monospace; font-weight: 800; font-size: 16px; letter-spacing: -.2px; color: #0B1220; }

        /* ── SFT 完工日過期紅字 ── */
        .date-overdue { color: #DC2626; font-weight: 700; }

        /* ── Loading ── */
        .loading-overlay {
            display: flex; align-items: center; justify-content: center;
            padding: 60px; color: var(--pd-text2); font-size: 15px; gap: 10px;
        }
        .spinner { width: 24px; height: 24px; border: 3px solid var(--pd-border); border-top-color: var(--pd-accent); border-radius: 50%; animation: spin .6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { color: #DC2626; padding: 30px; text-align: center; font-size: 14px; }
    </style>
    <link rel="stylesheet" href="/static/pds-ibm.css">
</head>
<body>
    <!-- ── Header ── -->
    <div class="header">
        <div class="header-inner">
            <div class="header-title">加工部查詢系統PDS</div>
            <div class="header-tabs">
                <a href="/" class="header-tab">製令查詢</a>
                <span class="header-tab active">生產中製令</span>
                <a href="/equipment" class="header-tab">設備稼動</a>
                <a href="/drawing" class="header-tab">PDM圖面查詢</a>
                <a href="/routing"      class="header-tab">產品途程查詢</a>
                <a href="/batch_cost" class="header-tab">批成本</a>
                <a href="/cnc_program" class="header-tab">程式管理</a>
                <a href="/oil"        class="header-tab">油品管理</a>
                <a href="/equipment_master" class="header-tab">設備管理</a>
                <a href="/zumen" class="header-tab header-tab-zumen">ZUMEN</a>
                <a href="/management" class="header-tab header-tab-mgmt">管理</a>
            </div>
            <span class="header-logo">MAXCLAW</span>
        </div>
    </div>

    <!-- ── Toolbar ── -->
    <div class="toolbar-wrap">
        <label>查看組別：</label>
        <select id="groupFilter">
            <option value="">全部</option>
            <option value="BN">BN</option>
            <option value="DR">DR</option>
            <option value="NC">NC</option>
            <option value="PC">PC</option>
            <option value="SN">SN</option>
            <option value="SP">SP</option>
        </select>
        <button class="btn-erp btn-erp-blue" onclick="loadData()">🔄 重新整理</button>
        <button class="btn-erp" onclick="exportExcel()">⬇ 另存Excel</button>
        <div class="toolbar-info" id="infoBar"></div>
    </div>

    <!-- ── Table ── -->
    <div class="table-container">
        <div class="loading-overlay" id="loadingMsg"><div class="spinner"></div>載入中...</div>
        <div class="error-msg" id="errorMsg" style="display:none"></div>
        <table id="dataTable" style="display:none">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
    // ══════════════════════════════════════════════
    //  Column Definition — 自動偵測 SSRS CSV 欄位名稱
    //  aliases: 多個可能的 CSV 欄位名稱（自動匹配第一個找到的）
    // ══════════════════════════════════════════════
    const COLUMNS = [
        { id: 'machine',    label: '生產機台',        w: '72px',  cls: 'cell-center',
          aliases: ['生產機台'] },
        { id: 'order',      label: '製令',            w: '150px',
          aliases: ['製令'] },
        { id: 'status',     label: '生產\n狀況',      w: '58px',  cls: 'cell-center', render: 'status',
          aliases: ['Textbox21', '生產狀況'] },
        { id: 'process',    label: '製程',            w: '42px',  cls: 'cell-center',
          aliases: ['製程'] },
        { id: 'product',    label: '品名',            w: '200px',
          aliases: ['品名'] },
        { id: 'stdtime',    label: '標工\n(秒)',      w: '55px',  cls: 'cell-num',
          aliases: ['ERP變動人時3', '標工_秒'] },
        { id: 'startdate',  label: '預計開工日\nSFT', w: '85px',  cls: 'cell-center',
          aliases: ['SFT預計開工日'] },
        { id: 'enddate',    label: '預計完工日\nSFT', w: '85px',  cls: 'cell-center', render: 'finishDate',
          aliases: ['SFT預計完工日'] },
        { id: 'releasedate',label: '最早\n發放日',    w: '78px',  cls: 'cell-center',
          aliases: ['最早發放日'] },
        { id: 'checkin',    label: '實際報工\n進站時間', w: '105px', cls: 'cell-center',
          aliases: ['進站時間3', '實際報工進站時間'] },
        { id: 'planqty',    label: '預計\n生產量',    w: '70px',  cls: 'cell-num',
          aliases: ['預計產量', '預計生產量'] },
        { id: 'realtime',   label: '即時\n生產量',    w: '92px',  cls: 'cell-num', render: 'realtime',
          aliases: ['現在產量', '即時生產量'] },
        { id: 'remain',     label: '完工仍需\n(小時)', w: '72px', cls: 'cell-num',
          aliases: ['Textbox11'] },
        { id: 'today',      label: '本日-含加班\n已生產/應生產', w: '110px', cls: 'cell-center',
          aliases: ['Textbox10'] },
        { id: 'thishour',   label: '本小時\n已生產/應生產',     w: '100px', cls: 'cell-center',
          aliases: ['Textbox31'] },
        { id: 'usetime',    label: '使用時間\n(分)',  w: '72px',  cls: 'cell-num',
          aliases: ['Textbox15'] },
    ];

    // 實際匹配到的 CSV key（loadData 時解析）
    let colKeyMap = {};  // id → actual csv key
    let allData = [], sortCol = null, sortAsc = true;
    let lastUpdateTime = null;
    const CACHE_KEY = 'pds_production_cache';

    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function num(s) { return parseFloat(String(s || '0').replace(/,/g, '')) || 0; }

    // ── 從實際欄位名稱中匹配 aliases ──
    function resolveColumns(csvColumns) {
        colKeyMap = {};
        const csvSet = new Set(csvColumns);
        COLUMNS.forEach(col => {
            col._csvKey = null;
            for (const alias of col.aliases) {
                if (csvSet.has(alias)) { col._csvKey = alias; colKeyMap[col.id] = alias; break; }
            }
            // 模糊匹配：如果精確匹配失敗，嘗試包含匹配
            if (!col._csvKey) {
                for (const csvCol of csvColumns) {
                    for (const alias of col.aliases) {
                        if (csvCol.includes(alias) || alias.includes(csvCol)) {
                            col._csvKey = csvCol; colKeyMap[col.id] = csvCol; break;
                        }
                    }
                    if (col._csvKey) break;
                }
            }
        });
        // 除錯
        const matched = COLUMNS.filter(c => c._csvKey).map(c => c.label.replace('\n','') + '→' + c._csvKey);
        const unmatched = COLUMNS.filter(c => !c._csvKey).map(c => c.label.replace('\n',''));
        console.log('欄位對應成功:', matched);
        if (unmatched.length) console.warn('欄位未對應:', unmatched);
        // 列出未使用的 CSV 欄位
        const usedKeys = new Set(Object.values(colKeyMap));
        const unused = csvColumns.filter(c => !usedKeys.has(c));
        if (unused.length) console.warn('CSV 未使用欄位:', unused);
    }

    function getVal(row, col) {
        return col._csvKey ? (row[col._csvKey] || '') : '';
    }

    // ── Build Header ──
    function buildHeader() {
        const tr = document.getElementById('tableHead');
        tr.innerHTML = '';
        COLUMNS.forEach(col => {
            const th = document.createElement('th');
            th.style.width = col.w || 'auto';
            th.innerHTML = esc(col.label).replace(/\n/g, '<br>');
            th.dataset.id = col.id;
            th.onclick = () => toggleSort(col.id);
            tr.appendChild(th);
        });
        updateSortIndicator();
    }

    function toggleSort(id) {
        if (sortCol === id) sortAsc = !sortAsc;
        else { sortCol = id; sortAsc = true; }
        updateSortIndicator();
        renderTable();
    }

    function updateSortIndicator() {
        document.querySelectorAll('#tableHead th').forEach(th => {
            th.classList.remove('sorted-asc', 'sorted-desc');
            if (th.dataset.id === sortCol) th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
        });
    }

    // ── Get Group ──
    function getGroup(machine) {
        const m = (machine || '').trim();
        if (!m) return '';
        const match = m.match(/^([A-Z]+)/i);
        return match ? match[1].toUpperCase() : m;
    }

    function getMachine(row) {
        const mc = COLUMNS.find(c => c.id === 'machine');
        return mc ? getVal(row, mc) : '';
    }

    // ── Render Cell ──
    function renderCell(td, col, val, row) {
        if (col.cls) td.className = col.cls;

        switch (col.render) {
            case 'status': {
                const s = (val || '').trim();
                if (s === '生產中') td.innerHTML = '<span class="st-producing">' + esc(s) + '</span>';
                else if (s === '暫停') td.innerHTML = '<span class="st-paused">' + esc(s) + '</span>';
                else if (s) td.innerHTML = '<span class="st-other">' + esc(s) + '</span>';
                break;
            }
            case 'realtime': {
                const n = num(val);
                if (n > 0) {
                    const pc = COLUMNS.find(c => c.id === 'planqty');
                    const plan = pc ? num(getVal(row, pc)) : 0;
                    // pct：實際達成率（可能 >100%，clamp 到 0~100 供畫條用；分級判斷用未 clamp 前的比較）
                    const rawPct = plan > 0 ? n / plan * 100 : 0;
                    const pct = Math.max(0, Math.min(rawPct, 100));
                    // 完成率分級上色（跟全站達成率同一套門檻：<70 紅／70~90 橙／90~100 綠／≥100 飽和綠）
                    const tier = rawPct >= 100 ? 'full' : rawPct >= 90 ? 'high' : rawPct >= 70 ? 'mid' : 'low';
                    // scaleX 保證固定從軌道最左邊長出來，不受寬度/百分比邊界值影響；極小值也保留可視最小刻度
                    const scale = plan > 0 ? Math.max(pct / 100, 0.03) : 0;
                    const track = plan > 0
                        ? '<span class="rt-track"><span class="rt-fill rt-fill-' + tier +
                          '" style="transform:scaleX(' + scale.toFixed(3) + ')"></span></span>'
                        : '';
                    td.innerHTML = '<span class="rt-wrap">' + track +
                        '<span class="rt-num">' + n.toLocaleString() + '</span></span>';
                    if (plan > 0) td.title = Math.round(rawPct) + '%（' + n.toLocaleString() + ' / ' + plan.toLocaleString() + '）';
                } else {
                    td.innerHTML = '<span class="rt-zero">0</span>';
                }
                break;
            }
            case 'finishDate': {
                td.textContent = val || '';
                if (val) {
                    try {
                        const d = new Date(val);
                        if (d < new Date() && !isNaN(d)) td.classList.add('date-overdue');
                    } catch(e) {}
                }
                break;
            }
            default:
                td.textContent = val || '';
        }
    }

    // ── 目前篩選＋排序後的資料（表格顯示、匯出 Excel 共用同一份）──
    function getDisplayedData() {
        const filter = document.getElementById('groupFilter').value;
        let data = filter ? allData.filter(r => getGroup(getMachine(r)) === filter) : [...allData];

        if (sortCol) {
            const sc = COLUMNS.find(c => c.id === sortCol);
            if (sc) {
                data.sort((a, b) => {
                    let va = getVal(a, sc), vb = getVal(b, sc);
                    const na = num(va), nb = num(vb);
                    const isNum = va !== '' && vb !== '' && !isNaN(parseFloat(va)) && !isNaN(parseFloat(vb));
                    let cmp = isNum ? na - nb : String(va).localeCompare(String(vb));
                    return sortAsc ? cmp : -cmp;
                });
            }
        }
        return data;
    }

    // ── Render Table ──
    function renderTable() {
        const filter = document.getElementById('groupFilter').value;
        const data = getDisplayedData();

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        data.forEach(row => {
            const tr = document.createElement('tr');
            COLUMNS.forEach(col => {
                const td = document.createElement('td');
                renderCell(td, col, getVal(row, col), row);
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        const now = lastUpdateTime || new Date();
        const timeStr = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0') + ' '
                      + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        document.getElementById('infoBar').innerHTML =
            '製令資料 <b>' + data.length + '</b> 筆' +
            (filter ? ' (篩選: ' + filter + ')' : '') +
            '<span class="update-time">更新時間: ' + timeStr + '</span>';
    }

    // ── 另存Excel（CSV，UTF-8 BOM，Excel 雙擊可直接開啟）：匯出目前畫面上篩選＋排序後的資料 ──
    function exportExcel() {
        const data = getDisplayedData();
        if (!data.length) { alert('目前沒有資料可匯出'); return; }

        const rows = [String.fromCharCode(0xFEFF)];
        rows.push(COLUMNS.map(c => '"' + c.label.replace(/\n/g, '') + '"').join(',') + '\r\n');
        data.forEach(row => {
            const cols = COLUMNS.map(c => '"' + String(getVal(row, c) || '').replace(/"/g, '""') + '"');
            rows.push(cols.join(',') + '\r\n');
        });

        const blob = new Blob(rows, { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const now = new Date();
        const stamp = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0')
                    + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
        a.href = url;
        a.download = `生產中製令_${stamp}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ── Load Data ──
    async function loadData() {
        const loading = document.getElementById('loadingMsg');
        const table = document.getElementById('dataTable');
        const err = document.getElementById('errorMsg');
        loading.style.display = 'flex'; table.style.display = 'none'; err.style.display = 'none';

        try {
            const resp = await fetch('/api/production');
            const json = await resp.json();
            if (!json.success) throw new Error(json.error || '查詢失敗');

            allData = json.data;

            // 從 API 回傳或從第一筆資料取得欄位名稱
            const csvCols = json.columns || (allData.length > 0 ? Object.keys(allData[0]) : []);
            console.log('SSRS CSV 原始欄位:', csvCols);
            resolveColumns(csvCols);

            // 預設排序
            if (!sortCol) sortCol = 'machine';

            lastUpdateTime = new Date();
            try {
                sessionStorage.setItem(CACHE_KEY, JSON.stringify({
                    allData, csvCols, lastUpdateTime: lastUpdateTime.toISOString()
                }));
            } catch (e) {}

            loading.style.display = 'none';
            table.style.display = 'table';
            buildHeader();
            renderTable();
        } catch (e) {
            loading.style.display = 'none';
            err.textContent = '載入失敗: ' + e.message;
            err.style.display = 'block';
        }
    }

    // ── 初始化：若有快取資料則直接顯示，不重新整理（除非按「重新整理」）──
    function initFromCache() {
        try {
            const cached = sessionStorage.getItem(CACHE_KEY);
            if (!cached) return false;
            const obj = JSON.parse(cached);
            if (!obj.allData || !obj.allData.length) return false;
            allData = obj.allData;
            lastUpdateTime = new Date(obj.lastUpdateTime);
            resolveColumns(obj.csvCols || Object.keys(allData[0]));
            if (!sortCol) sortCol = 'machine';
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('dataTable').style.display = 'table';
            buildHeader();
            renderTable();
            return true;
        } catch (e) { return false; }
    }

    document.getElementById('groupFilter').onchange = renderTable;
    buildHeader();
    if (!initFromCache()) loadData();
    </script>
</body>
</html>
