<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加工部查詢系統PDS</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='4' fill='%230f62fe'/><polygon fill='white' points='8.5,5.94 10.44,3.13 13.56,3.13 15.5,5.94 18.89,6.21 20.46,8.92 19,12 20.46,15.08 18.89,17.79 15.5,18.06 13.56,20.87 10.44,20.87 8.5,18.06 5.11,17.79 3.54,15.08 5,12 3.54,8.92 5.11,6.21'/><circle cx='12' cy='12' r='4' fill='%230f62fe'/></svg>">
  <style>
    /* ══════════════════════════════════════════════
       UI-UX-PRO — 產品途程查詢 Design System
    ══════════════════════════════════════════════ */
    :root {
      --blue:        #1565C0;
      --blue-d:      #0D47A1;
      --blue-mid:    #1976D2;
      --blue-light:  #42A5F5;
      --blue-pale:   #E3F2FD;
      --blue-xpale:  #F0F8FF;
      --bg:          #F0F2F5;
      --surface:     #FFFFFF;
      --surface-2:   #FAFBFC;
      --border:      #DDE3EA;
      --border-d:    #BEC7D0;
      --text:        #1A2332;
      --text-2:      #3D5166;
      --muted:       #7A8FA3;
      --muted-light: #A8BAC8;
      --row-even:    #F7FAFF;
      --row-hover:   #EBF4FF;
      --success:     #2E7D32;
      --success-bg:  #E8F5E9;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md:   0 4px 12px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.06);
      --shadow-lg:   0 10px 30px rgba(0,0,0,.14), 0 4px 8px rgba(0,0,0,.08);
      --radius:      8px;
      --radius-sm:   5px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: 'Microsoft JhengHei', 'Segoe UI', Arial, sans-serif;
      font-size: 0.85rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      line-height: 1.5;
    }

    /* ══ Top Navigation Header ══ */
    .header {
      background: linear-gradient(180deg,#1976D2,#0D47A1);
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(13,71,161,.4);
      position: relative;
      z-index: 100;
    }
    .header-inner { display:flex; align-items:flex-end; padding:.4rem 1rem 0; }
    .header-title { font-size:1.1rem; font-weight:700; padding-bottom:.45rem; white-space:nowrap; margin-right:.5rem; }
    .header-tabs { display:flex; align-items:flex-end; gap:2px; }
    .header-tab {
      display: inline-block; padding:.3rem 1rem; font-size:.82rem; font-weight:600;
      color:rgba(255,255,255,.85); text-decoration:none; border-radius:6px 6px 0 0;
      background:rgba(255,255,255,.15); cursor:pointer; transition:background .15s;
    }
    .header-tab.active,.header-tab:hover { background:#fff; color:var(--blue-d); }

    /* ══ Sub-tab Bar ══ */
    .sub-tabs-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.25rem;
      display: flex;
      gap: 0;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .sub-tab {
      padding: .6rem 1.4rem;
      font-size: .83rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      transition: all .18s ease;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .sub-tab:hover { color: var(--blue-mid); }
    .sub-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

    /* ══ Sub-content layout ══ */
    .sub-content { display: none; flex: 1; overflow: hidden; }
    .sub-content.active { display: flex; }

    /* ══ Page Body ══ */
    .page-body {
      display: flex;
      gap: 0.75rem;
      padding: 0.75rem;
      flex: 1;
      overflow: hidden;
    }

    /* ══ Panels ══ */
    .panel-left {
      width: 300px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .panel-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      min-width: 0;
    }

    /* ══ Card ══ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .card-header {
      background: linear-gradient(135deg, var(--blue-mid) 0%, var(--blue-d) 100%);
      color: white;
      padding: 0.5rem 0.85rem;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      letter-spacing: 0.01em;
    }
    .card-header .badge {
      background: rgba(255,255,255,0.22);
      border-radius: 20px;
      padding: 0.05rem 0.55rem;
      font-size: 0.73rem;
      font-weight: 600;
      margin-left: auto;
    }
    .card-body { padding: 0.6rem 0.75rem; }

    /* ══ Search Controls ══ */
    .search-row { display: flex; gap: 0.4rem; }
    .search-input {
      flex: 1;
      padding: 0.42rem 0.7rem;
      border: 1.5px solid var(--border-d);
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      transition: border-color .15s, box-shadow .15s;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--blue-mid);
      box-shadow: 0 0 0 3px rgba(25,118,210,.12);
    }
    .search-input::placeholder { color: var(--muted-light); }

    /* ══ Buttons ══ */
    .btn {
      padding: 0.42rem 0.85rem;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: all .15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--blue-mid) 0%, var(--blue) 100%);
      color: white;
      box-shadow: 0 2px 5px rgba(21,101,192,.3);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--blue-light) 0%, var(--blue-mid) 100%);
      box-shadow: 0 3px 8px rgba(21,101,192,.4);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-success {
      background: linear-gradient(135deg, #43A047 0%, #2E7D32 100%);
      color: white;
      box-shadow: 0 2px 5px rgba(46,125,50,.3);
    }
    .btn-success:hover { background: linear-gradient(135deg, #66BB6A 0%, #388E3C 100%); transform: translateY(-1px); }
    .btn-success:disabled { background: #B0BEC5; box-shadow: none; cursor: default; transform: none; }
    .btn-sm { padding: 0.28rem 0.65rem; font-size: 0.77rem; }

    /* ══ Line Filter ══ */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }
    .filter-select {
      font-size: 0.81rem;
      padding: 0.25rem 0.55rem;
      border: 1.5px solid var(--border-d);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s;
    }
    .filter-select:focus { outline: none; border-color: var(--blue-mid); }

    /* ══ Prefix Filter (BOM) ══ */
    .prefix-filter { display:flex; align-items:center; gap:0.4rem; margin-top:0.5rem; flex-wrap:wrap; }
    .prefix-btn { display:inline-flex; align-items:center; cursor:pointer; font-size:0.78rem; }
    .prefix-btn input[type=radio] { display:none; }
    .prefix-btn span {
      padding:0.18rem 0.6rem; border:1.5px solid var(--border-d); border-radius:14px;
      background: var(--surface-2); color: var(--text-2);
      transition: all .15s; white-space:nowrap; font-weight: 600;
    }
    .prefix-btn input[type=radio]:checked + span {
      background: var(--blue); color: white; border-color: var(--blue);
      box-shadow: 0 2px 5px rgba(21,101,192,.25);
    }
    .prefix-btn:hover span { background: var(--blue-pale); border-color: var(--blue-mid); color: var(--blue); }

    /* ══ Result List ══ */
    .result-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-d) transparent;
    }
    .result-list::-webkit-scrollbar { width: 5px; }
    .result-list::-webkit-scrollbar-thumb { background: var(--border-d); border-radius: 3px; }
    .result-item {
      padding: 0.5rem 0.8rem;
      border-bottom: 1px solid #F0F2F5;
      cursor: pointer;
      transition: background .12s, border-left .12s;
      border-left: 3px solid transparent;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover {
      background: var(--row-hover);
      border-left-color: var(--blue-light);
    }
    .result-item.selected {
      background: var(--blue-xpale);
      border-left: 3px solid var(--blue);
    }
    .result-item .item-no {
      font-weight: 700;
      color: var(--blue-d);
      font-size: 0.82rem;
      font-family: 'Consolas', 'Courier New', monospace;
      letter-spacing: 0.02em;
    }
    .result-item .item-name {
      color: var(--text-2);
      font-size: 0.8rem;
      margin-top: 0.1rem;
    }

    /* ══ Detail Info Bar ══ */
    .detail-info-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1.2rem;
      padding: 0.5rem 0.85rem;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .info-chip {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
    }
    .info-chip .lbl {
      color: var(--muted);
      font-weight: 500;
    }
    .info-chip .val {
      color: var(--text);
      font-weight: 700;
    }
    .ver-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      background: var(--blue-pale);
      color: var(--blue);
      border: 1px solid rgba(21,101,192,.2);
      border-radius: 14px;
      padding: 0.1rem 0.55rem;
      font-size: 0.74rem;
      font-weight: 700;
    }

    /* ══ Toolbar ══ */
    .detail-toolbar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 0.85rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      flex-wrap: wrap;
    }
    .check-count { margin-left: auto; font-size: 0.79rem; color: var(--muted); }
    .check-count strong { color: var(--success); font-size: 0.88rem; }

    /* ══ Table ══ */
    .table-wrap { flex: 1; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--border-d) transparent; }
    .table-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--border-d); border-radius: 3px; }

    table.pro-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    table.pro-table thead th {
      background: var(--blue-d);
      color: rgba(255,255,255,.92);
      padding: 0.45rem 0.65rem;
      text-align: left;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
      font-weight: 600;
      font-size: 0.77rem;
      letter-spacing: 0.02em;
      border-right: 1px solid rgba(255,255,255,.08);
    }
    table.pro-table thead th:last-child { border-right: none; }
    table.pro-table thead th.center { text-align: center; }
    table.pro-table tbody td {
      padding: 0.38rem 0.65rem;
      border-bottom: 1px solid #EDF1F5;
      vertical-align: middle;
      color: var(--text-2);
    }
    table.pro-table tbody tr:nth-child(even) td { background: var(--row-even); }
    table.pro-table tbody tr:hover td {
      background: var(--row-hover) !important;
      color: var(--text);
    }
    table.pro-table td.td-code {
      font-family: 'Consolas','Courier New',monospace;
      font-weight: 700;
      color: var(--blue-d);
      font-size: 0.79rem;
    }
    table.pro-table td.td-num {
      font-weight: 700;
      text-align: right;
      color: var(--success);
    }
    table.pro-table td.td-center { text-align: center; }
    table.pro-table td.td-seq {
      text-align: center;
      font-weight: 800;
      color: var(--blue-d);
      font-size: 0.88rem;
    }
    table.pro-table td.td-muted { color: var(--muted); font-size: 0.77rem; }
    table.pro-table td.td-desc { max-width: 260px; word-break: break-all; font-size: 0.77rem; }
    table.pro-table th.check-col, table.pro-table td.check-col { width: 34px; text-align: center; }
    table.pro-table tbody tr.checked td { background: var(--success-bg) !important; }

    /* ══ Nature Badges ══ */
    .nature-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.12rem 0.55rem;
      border-radius: 12px;
      font-size: 0.74rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .nature-inner { background: #E3F2FD; color: #0D47A1; }
    .nature-outer { background: #FFF3E0; color: #E65100; }
    .nature-sub   { background: #F3E5F5; color: #6A1B9A; }

    /* ══ Empty / Error / Loading States ══ */
    .msg-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3.5rem 1rem;
      color: var(--muted-light);
      gap: 0.65rem;
      text-align: center;
    }
    .msg-empty svg { opacity: .35; }
    .msg-empty span { font-size: 0.83rem; }
    .msg-error {
      margin: 0.75rem;
      padding: 0.75rem 1rem;
      color: #c62828;
      background: #fff5f5;
      border: 1px solid #ffcdd2;
      border-left: 4px solid #ef5350;
      border-radius: var(--radius-sm);
      font-size: 0.81rem;
    }
    .msg-info { padding: 0.4rem 0; font-size: 0.79rem; color: var(--muted); min-height: 1.4rem; }

    /* ══ Spinner ══ */
    .spinner {
      display: inline-block;
      width: 22px; height: 22px;
      border: 2.5px solid rgba(25,118,210,.2);
      border-top-color: var(--blue-mid);
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══ Modal ══ */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(10,20,40,0.5);
      backdrop-filter: blur(2px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-box {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: min(960px, 95vw);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalIn .2s ease;
    }
    @keyframes modalIn { from { opacity:0; transform:scale(.97) translateY(6px); } to { opacity:1; transform:none; } }
    .modal-header {
      background: linear-gradient(135deg, var(--blue-mid) 0%, var(--blue-d) 100%);
      color: white;
      padding: 0.7rem 1.1rem;
      font-weight: 700;
      font-size: 0.88rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .modal-close {
      background: rgba(255,255,255,.15); border: none; color: white;
      font-size: 0.88rem; cursor: pointer; padding: 0.2rem 0.5rem;
      border-radius: 4px; transition: background .15s;
    }
    .modal-close:hover { background: rgba(255,255,255,.28); }
    .modal-info {
      padding: 0.55rem 1.1rem;
      background: var(--blue-xpale);
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.81rem;
      flex-shrink: 0;
    }
    .modal-body { overflow: auto; flex: 1; }
  </style>
  <link rel="stylesheet" href="/static/pds-ibm.css">
</head>
<body>

<!-- ══════════ Top Navigation ══════════ -->
<div class="header">
  <div class="header-inner">
    <div class="header-title">加工部查詢系統PDS</div>
    <div class="header-tabs">
      <a href="/"           class="header-tab">製令查詢</a>
      <a href="/production" class="header-tab">生產中製令</a>
      <a href="/equipment"  class="header-tab">設備稼動</a>
      <a href="/drawing"    class="header-tab">PDM圖面查詢</a>
      <span                 class="header-tab active">產品途程查詢</span>
      <a href="/application" class="header-tab">申請單</a>
    </div>
  </div>
</div>

<!-- ══════════ Sub-tab Bar ══════════ -->
<div class="sub-tabs-bar">
  <div class="sub-tab active" data-tab="routing" onclick="switchSubTab('routing')">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
    途程查詢
  </div>
  <div class="sub-tab" data-tab="bom" onclick="switchSubTab('bom')">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    BOM查詢
  </div>
</div>

<!-- ══════════ 途程查詢 ══════════ -->
<div id="tab-routing" class="sub-content active">
  <div class="page-body">

    <!-- 左側 -->
    <div class="panel-left">
      <div class="card">
        <div class="card-header">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          搜尋條件
        </div>
        <div class="card-body">
          <div class="search-row">
            <input type="text" id="r-search-input" class="search-input"
                   placeholder="品號或品名（空格=AND）" autocomplete="off"
                   onkeydown="if(event.key==='Enter') rSearch()">
            <button class="btn btn-primary" onclick="rSearch()">搜尋</button>
          </div>
          <div class="filter-row">
            <span class="filter-label">線別篩選</span>
            <select id="r-line-filter" class="filter-select" onchange="rApplyLineFilter()">
              <option value="000-1" selected>000-1 加工課</option>
              <option value="000-2">000-2 成品部</option>
              <option value="000-3">000-3 製三課</option>
              <option value="">全部</option>
            </select>
          </div>
          <div id="r-search-info" class="msg-info"></div>
        </div>
      </div>

      <div class="card" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
        <div class="card-header">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          搜尋結果
          <span id="r-result-count" class="badge"></span>
        </div>
        <div class="result-list" id="r-result-list">
          <div class="msg-empty">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <span>請輸入品號或品名搜尋</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 右側 -->
    <div class="panel-right">
      <div class="card" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
        <div class="card-header">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          產品途程明細
          <span id="r-item-title" style="font-weight:500;margin-left:.4rem;opacity:.8;font-size:0.77rem"></span>
        </div>

        <div class="detail-info-bar" id="r-detail-info" style="display:none">

<script>
// ═══════════════════════════════════════════════════
// Sub-tab switching
// ═══════════════════════════════════════════════════
function switchSubTab(tab) {
  document.querySelectorAll('.sub-tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.sub-content').forEach(el => el.classList.remove('active'));
  document.querySelector(`.sub-tab[data-tab="${tab}"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  history.replaceState(null, '', `/routing?tab=${tab}`);
  _saveState();
}

(function() {
  const tab = new URLSearchParams(window.location.search).get('tab');
  if (tab === 'bom') switchSubTab('bom');
})();

// ═══════════════════════════════════════════════════
// 途程查詢
// ═══════════════════════════════════════════════════
let rCurrentItem = null;
let _rItems   = [];
let _rRouting = [];

function rApplyLineFilter() {
  const q = document.getElementById('r-search-input').value.trim();
  if (q) rSearch();
}

function rRenderRouting(rows) {
  if (!rows.length) {
    document.getElementById('r-empty-msg').innerHTML = '<span>此品號尚無途程資料</span>';
    document.getElementById('r-empty-msg').style.display = 'flex';
    document.getElementById('r-table').style.display = 'none';
    return;
  }
  document.getElementById('r-tbody').innerHTML = rows.map(r => {
    const natCls = r.nature.includes('廠內') ? 'nature-inner'
                 : r.nature.includes('訂外') ? 'nature-outer' : 'nature-sub';
    return `<tr>
      <td class="td-seq">${esc(r.seq)}</td>
      <td class="td-code">${esc(r.proc_code)}</td>
      <td class="td-code">${esc(r.machine_code)}</td>
      <td>${esc(r.machine_name ?? '')}</td>
      <td>${esc(r.res_group)}</td>
      <td>${esc(r.proc_name)}</td>
      <td><span class="nature-tag ${natCls}">${esc(r.nature)}</span></td>
      <td>${esc(r.vendor_no)}</td>
      <td>${esc(r.vendor_name)}</td>
      <td class="td-num">${esc(r.var_man_hrs ?? '')}</td>
      <td class="td-desc">${esc(r.description)}</td>
    </tr>`;
  }).join('');
  document.getElementById('r-empty-msg').style.display = 'none';
  document.getElementById('r-table').style.display = '';
}

async function rSearch() {
  const q    = document.getElementById('r-search-input').value.trim();
  const line = document.getElementById('r-line-filter').value;
  if (!q) { document.getElementById('r-search-info').textContent = '請輸入品號或品名'; return; }

  const list = document.getElementById('r-result-list');
  const cnt  = document.getElementById('r-result-count');
  list.innerHTML = '<div class="msg-empty"><span class="spinner"></span><span>搜尋中…</span></div>';
  cnt.textContent = '';
  document.getElementById('r-search-info').textContent = '';

  try {
    const res  = await fetch(`/api/routing/search?q=${encodeURIComponent(q)}&line=${encodeURIComponent(line)}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    if (!data.data.length) {
      list.innerHTML = '<div class="msg-empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span>找不到有途程的品號</span></div>';
      cnt.textContent = '0';
      _rItems = [];
      return;
    }
    _rItems = data.data;
    cnt.textContent = data.count;
    list.innerHTML = _rItems.map((it, idx) => `
      <div class="result-item" onclick="rSelectItem(${idx})" data-no="${esc(it.item_no)}">
        <div class="item-no">${esc(it.item_no)}</div>
        <div class="item-name">${esc(it.item_name)}</div>
      </div>`).join('');
    _saveState();
  } catch(e) {
    list.innerHTML = `<div class="msg-error">搜尋失敗：${esc(e.message)}</div>`;
  }
}

async function rSelectItem(idx) {
  const item = _rItems[idx];
  if (!item) return;
  rCurrentItem = item;

  document.querySelectorAll('#r-result-list .result-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.no === item.item_no);
  });

  document.getElementById('r-item-title').textContent = item.item_no;
  document.getElementById('r-detail-info').style.display = 'none';
  document.getElementById('r-table').style.display = 'none';
  document.getElementById('r-empty-msg').innerHTML =
    '<span class="spinner"></span><span>載入途程中…</span>';
  document.getElementById('r-empty-msg').style.display = 'flex';

  try {
    const res  = await fetch(`/api/bom/routing?item_no=${encodeURIComponent(item.item_no)}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    const h = data.header || {};
    document.getElementById('r-info-no').textContent   = h.item_no   || '';
    document.getElementById('r-info-name').textContent = h.item_name || '';
    document.getElementById('r-info-unit').textContent = h.unit       || '';
    document.getElementById('r-info-ver').textContent  = h.version    || '-';
    document.getElementById('r-detail-info').style.display = '';

    if (!data.has_routing || !data.routing.length) {
      document.getElementById('r-empty-msg').innerHTML = '<span>此品號尚無途程資料</span>';
      document.getElementById('r-empty-msg').style.display = 'flex';
      document.getElementById('r-table').style.display = 'none';
      return;
    }
    _rRouting = data.routing;
    rRenderRouting(_rRouting);
    _saveState();
  } catch(e) {
    document.getElementById('r-empty-msg').innerHTML =
      `<div class="msg-error">載入失敗：${esc(e.message)}</div>`;
  }
}

// ═══════════════════════════════════════════════════
// BOM 查詢
// ═══════════════════════════════════════════════════
let bCurrentItem = null;
let _bItems  = [];
let bChecked = new Set();

async function bSearch() {
  const q      = document.getElementById('b-search-input').value.trim();
  const prefix = document.querySelector('input[name=bprefix]:checked').value;
  if (!q) { document.getElementById('b-search-info').textContent = '請輸入品號或品名'; return; }

  const list = document.getElementById('b-result-list');
  const cnt  = document.getElementById('b-result-count');
  list.innerHTML = '<div class="msg-empty"><span class="spinner"></span><span>搜尋中…</span></div>';
  cnt.textContent = '';
  document.getElementById('b-search-info').textContent = '';

  try {
    const res  = await fetch(`/api/bom/search?q=${encodeURIComponent(q)}&prefix=${encodeURIComponent(prefix)}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    if (!data.data.length) {
      list.innerHTML = '<div class="msg-empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span>找不到 BOM 資料</span></div>';
      cnt.textContent = '0';
      _bItems = [];
      return;
    }
    _bItems = data.data;
    cnt.textContent = data.count;
    list.innerHTML = _bItems.map((it, idx) => `
      <div class="result-item" onclick="bSelectItem(${idx})" data-no="${esc(it.item_no)}">
        <div class="item-no">${esc(it.item_no)}</div>
        <div class="item-name">${esc(it.item_name)}</div>
      </div>`).join('');
    _saveState();
  } catch(e) {
    list.innerHTML = `<div class="msg-error">搜尋失敗：${esc(e.message)}</div>`;
  }
}

async function bSelectItem(idx) {
  const item = _bItems[idx];
  if (!item) return;
  bCurrentItem = item;
  bChecked.clear();
  updateBCheckCount();

  document.querySelectorAll('#b-result-list .result-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.no === item.item_no);
  });

  document.getElementById('b-item-title').textContent = item.item_no;
  document.getElementById('b-detail-info').style.display = 'none';
  document.getElementById('b-toolbar').style.display = 'none';
  document.getElementById('b-table').style.display = 'none';
  document.getElementById('b-empty-msg').innerHTML =
    '<span class="spinner"></span><span>載入 BOM 中…</span>';
  document.getElementById('b-empty-msg').style.display = 'flex';

  try {
    const res  = await fetch(`/api/bom/detail?item_no=${encodeURIComponent(item.item_no)}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    const h = data.header || {};
    document.getElementById('b-info-no').textContent   = h.item_no   || '';
    document.getElementById('b-info-name').textContent = h.item_name || '';
    document.getElementById('b-info-unit').textContent = h.unit       || '';
    document.getElementById('b-detail-info').style.display = '';
    document.getElementById('b-toolbar').style.display = '';
    document.getElementById('b-btn-routing').disabled = false;

    if (!data.detail.length) {
      document.getElementById('b-empty-msg').innerHTML = '<span>此品號無 BOM 明細</span>';
      document.getElementById('b-empty-msg').style.display = 'flex';
      document.getElementById('b-table').style.display = 'none';
      return;
    }

    document.getElementById('b-tbody').innerHTML = data.detail.map(r => `
      <tr data-no="${esc(r.child_no)}">
        <td class="check-col">
          <input type="checkbox" onchange="bToggleRow(this,'${esc(r.child_no)}')">
        </td>
        <td class="td-center">${esc(r.seq)}</td>
        <td class="td-code">${esc(r.child_no)}</td>
        <td>${esc(r.child_name)}</td>
        <td class="td-muted">${esc(r.spec)}</td>
        <td class="td-center">${esc(r.unit)}</td>
        <td class="td-num">${esc(r.qty)}</td>
        <td>${esc(r.attr)}</td>
      </tr>`).join('');
    document.getElementById('b-chk-all').checked = false;
    document.getElementById('b-empty-msg').style.display = 'none';
    document.getElementById('b-table').style.display = '';
    _saveState();

  } catch(e) {
    document.getElementById('b-empty-msg').innerHTML =
      `<div class="msg-error">載入失敗：${esc(e.message)}</div>`;
  }
}

function bToggleRow(cb, itemNo) {
  if (cb.checked) bChecked.add(itemNo); else bChecked.delete(itemNo);
  cb.closest('tr').classList.toggle('checked', cb.checked);
  updateBCheckCount();
}
function bToggleAll(cb) {
  document.querySelectorAll('#b-tbody input[type=checkbox]').forEach(c => {
    c.checked = cb.checked;
    const no = c.closest('tr').dataset.no;
    if (cb.checked) bChecked.add(no); else bChecked.delete(no);
    c.closest('tr').classList.toggle('checked', cb.checked);
  });
  updateBCheckCount();
}
function updateBCheckCount() {
  document.getElementById('b-check-count').textContent = bChecked.size;
}

// ═══════════════════════════════════════════════════
// 從 BOM 查看途程 Modal
// ═══════════════════════════════════════════════════
async function bShowRouting() {
  if (!bCurrentItem) return;
  const modal = document.getElementById('routing-modal');
  modal.style.display = 'flex';
  document.getElementById('rm-info').innerHTML = '';
  document.getElementById('rm-content').innerHTML =
    '<div class="msg-empty"><span class="spinner"></span><span>載入途程中…</span></div>';

  try {
    const res  = await fetch(`/api/bom/routing?item_no=${encodeURIComponent(bCurrentItem.item_no)}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error);

    const h = data.header || {};
    document.getElementById('rm-info').innerHTML = `
      <div class="info-chip"><span class="lbl">品號</span><strong style="font-family:Consolas">${esc(h.item_no||'')}</strong></div>
      <div class="info-chip"><span class="lbl">品名</span><strong>${esc(h.item_name||'')}</strong></div>
      <div class="info-chip"><span class="lbl">途程版次</span><span class="ver-chip">${esc(h.version||'-')}</span></div>
    `;

    if (!data.has_routing) {
      document.getElementById('rm-content').innerHTML =
        '<div class="msg-empty"><span>此品號尚無途程資料</span></div>';
      return;
    }

    document.getElementById('rm-content').innerHTML = `
      <table class="pro-table" style="font-size:0.79rem">
        <thead><tr>
          <th style="width:54px" class="center">順序</th>
          <th style="width:80px">製程代號</th>
          <th style="width:88px">機台代號</th>
          <th style="width:88px">機台名稱</th>
          <th style="width:100px">資源群組</th>
          <th style="width:120px">製程名稱</th>
          <th style="width:82px">性質</th>
          <th style="width:88px">廠商代號</th>
          <th style="width:120px">廠商名稱</th>
          <th style="width:72px;text-align:right">變動人時</th>
          <th>製程敘述</th>
        </tr></thead>
        <tbody>${data.routing.map(r => {
          const natCls = r.nature.includes('廠內') ? 'nature-inner'
                       : r.nature.includes('訂外') ? 'nature-outer' : 'nature-sub';
          return `<tr>
            <td class="td-seq">${esc(r.seq)}</td>
            <td class="td-code">${esc(r.proc_code)}</td>
            <td class="td-code">${esc(r.machine_code)}</td>
            <td>${esc(r.machine_name ?? '')}</td>
            <td>${esc(r.res_group)}</td>
            <td>${esc(r.proc_name)}</td>
            <td><span class="nature-tag ${natCls}">${esc(r.nature)}</span></td>
            <td>${esc(r.vendor_no)}</td>
            <td>${esc(r.vendor_name)}</td>
            <td class="td-num">${esc(r.var_man_hrs ?? '')}</td>
            <td class="td-desc">${esc(r.description)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
  } catch(e) {
    document.getElementById('rm-content').innerHTML =
      `<div class="msg-error">載入失敗：${esc(e.message)}</div>`;
  }
}
function closeRoutingModal() {
  document.getElementById('routing-modal').style.display = 'none';
}

// ═══════════════════════════════════════════════════
// Utilities
// ═══════════════════════════════════════════════════
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════
// State persistence — 切換頁面後自動還原查詢結果
// ═══════════════════════════════════════════════════
const _SS_KEY = 'pds_routing';

function _saveState() {
  try {
    const prefixEl = document.querySelector('input[name=bprefix]:checked');
    sessionStorage.setItem(_SS_KEY, JSON.stringify({
      _ts: Date.now(),
      activeTab: (document.querySelector('.sub-tab.active') || {}).dataset?.tab || 'routing',
      r: {
        query: document.getElementById('r-search-input').value,
        line:  document.getElementById('r-line-filter').value,
        items: _rItems,
        selectedNo: rCurrentItem ? rCurrentItem.item_no : '',
        routing: _rRouting,
        header: rCurrentItem ? {
          item_no:   document.getElementById('r-info-no').textContent,
          item_name: document.getElementById('r-info-name').textContent,
          unit:      document.getElementById('r-info-unit').textContent,
          version:   document.getElementById('r-info-ver').textContent,
        } : null,
      },
      b: {
        query: document.getElementById('b-search-input').value,
        prefix: prefixEl ? prefixEl.value : '',
        items: _bItems,
        selectedNo: bCurrentItem ? bCurrentItem.item_no : '',
        bom_html: bCurrentItem
          ? document.getElementById('b-tbody').innerHTML
          : '',
        header: bCurrentItem ? {
          item_no:   document.getElementById('b-info-no').textContent,
          item_name: document.getElementById('b-info-name').textContent,
          unit:      document.getElementById('b-info-unit').textContent,
        } : null,
      }
    }));
  } catch(e) { /* sessionStorage 滿了或私密模式 */ }
}

function _restoreState() {
  try {
    const raw = sessionStorage.getItem(_SS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || (Date.now() - s._ts) > 3_600_000) return;  // 1 小時後不還原

    // 還原 sub-tab
    const urlTab = new URLSearchParams(window.location.search).get('tab');
    const tab = urlTab || s.activeTab || 'routing';
    if (tab !== 'routing') switchSubTab(tab);

    // ── 途程 tab ──
    const r = s.r || {};
    if (r.query) {
      document.getElementById('r-search-input').value = r.query || '';
      if (r.line) document.getElementById('r-line-filter').value = r.line;
      if (r.items && r.items.length) {
        _rItems = r.items;
        document.getElementById('r-result-count').textContent = _rItems.length;
        document.getElementById('r-result-list').innerHTML = _rItems.map((it, i) =>
          `<div class="result-item${it.item_no === r.selectedNo ? ' selected' : ''}"
                onclick="rSelectItem(${i})" data-no="${esc(it.item_no)}">
            <div class="item-no">${esc(it.item_no)}</div>
            <div class="item-name">${esc(it.item_name)}</div>
          </div>`).join('');

        if (r.selectedNo && r.header && r.routing && r.routing.length) {
          rCurrentItem = _rItems.find(it => it.item_no === r.selectedNo) || null;
          if (rCurrentItem) {
            _rRouting = r.routing;
            document.getElementById('r-item-title').textContent  = r.selectedNo;
            document.getElementById('r-info-no').textContent     = r.header.item_no   || '';
            document.getElementById('r-info-name').textContent   = r.header.item_name || '';
            document.getElementById('r-info-unit').textContent   = r.header.unit      || '';
            document.getElementById('r-info-ver').textContent    = r.header.version   || '-';
            document.getElementById('r-detail-info').style.display = '';
            rRenderRouting(_rRouting);
          }
        }
      }
    }

    // ── BOM tab ──
    const b = s.b || {};
    if (b.query) {
      document.getElementById('b-search-input').value = b.query || '';
      if (b.prefix !== undefined) {
        const radio = document.querySelector(`input[name=bprefix][value="${b.prefix}"]`);
        if (radio) radio.checked = true;
      }
      if (b.items && b.items.length) {
        _bItems = b.items;
        document.getElementById('b-result-count').textContent = _bItems.length;
        document.getElementById('b-result-list').innerHTML = _bItems.map((it, i) =>
          `<div class="result-item${it.item_no === b.selectedNo ? ' selected' : ''}"
                onclick="bSelectItem(${i})" data-no="${esc(it.item_no)}">
            <div class="item-no">${esc(it.item_no)}</div>
            <div class="item-name">${esc(it.item_name)}</div>
          </div>`).join('');

        if (b.selectedNo && b.header && b.bom_html) {
          bCurrentItem = _bItems.find(it => it.item_no === b.selectedNo) || null;
          if (bCurrentItem) {
            document.getElementById('b-item-title').textContent  = b.selectedNo;
            document.getElementById('b-info-no').textContent     = b.header.item_no   || '';
            document.getElementById('b-info-name').textContent   = b.header.item_name || '';
            document.getElementById('b-info-unit').textContent   = b.header.unit      || '';
            document.getElementById('b-detail-info').style.display = '';
            document.getElementById('b-toolbar').style.display = '';
            document.getElementById('b-btn-routing').disabled = false;
            document.getElementById('b-tbody').innerHTML = b.bom_html;
            document.getElementById('b-empty-msg').style.display = 'none';
            document.getElementById('b-table').style.display = '';
          }
        }
      }
    }
  } catch(e) {}
}

document.addEventListener('DOMContentLoaded', _restoreState);
</script>
</body>
</html>
