<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加工部查詢系統PDS - PDM圖面查詢</title>
    <link rel="icon" type="image/png" href="/static/app-icon.png">
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ══ ERP Classic Blue ══ */
        :root {
            --erp-blue:       #1565C0;
            --erp-blue-dark:  #0D47A1;
            --erp-blue-mid:   #1976D2;
            --erp-blue-light: #E3F2FD;
            --erp-bg:         #ECF0F5;
            --erp-surface:    #FFFFFF;
            --erp-border:     #BDC3C7;
            --erp-border-dk:  #95A5A6;
            --erp-text:       #212121;
            --erp-muted:      #546E7A;
            --erp-row-even:   #F5F9FF;
            --erp-row-hover:  #DDEEFF;
            --success:        #2E7D32;
        }

        * { box-sizing: border-box; }
        body, * {
            font-family: 'Noto Sans TC', 'Source Han Sans TC', sans-serif;
        }
        body {
            background: var(--erp-bg);
            color: var(--erp-text);
            font-size: 0.85rem;
            margin: 0;
        }

        /* ── 標題列 ── */
        .header{background:#1565C0;color:#fff;
          position:sticky;top:0;z-index:200;box-shadow:0 2px 6px rgba(0,0,0,.3)}
        .header-inner{display:flex;align-items:flex-end;padding:.4rem 1rem 0}
        .header-logo{margin-left:auto;align-self:center;font-size:1.15rem;font-weight:800;font-style:italic;letter-spacing:.03em;color:#F5A623}
        .header-title{font-size:1.1rem;font-weight:700;padding-bottom:.45rem;white-space:nowrap;margin-right:.5rem}
        .header-tabs{display:flex;align-items:flex-end;gap:2px}
        .header-tab{display:inline-block;padding:.3rem 1rem;font-size:1rem;font-weight:600;
          color:rgba(255,255,255,.85);text-decoration:none;border-radius:0;
          background:rgba(255,255,255,.15);cursor:pointer;transition:background .15s}
        .header-tab.active,.header-tab:hover{background:#fff;color:var(--erp-blue);
            font-weight: 600;
        }

        
        .header-tab-mgmt{background:#06C755;color:#fff}
        .header-tab-mgmt.active,.header-tab-mgmt:hover{background:#05A649;color:#fff}/* ── Page ── */
        .page-body { padding: 0.75rem 1rem; max-width: 1600px; margin: 0 auto; }

        /* ── Panel ── */
        .erp-panel {
            background: var(--erp-surface);
            border: 1px solid var(--erp-border);
            margin-bottom: 0.6rem;
        }
        .search-row {
            padding: 0.5rem 0.75rem;
            background: var(--erp-surface);
            border-bottom: 1px solid var(--erp-border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .search-label { font-size: 0.82rem; font-weight: 700; color: var(--erp-blue-dark); white-space: nowrap; }

        /* ── Form controls ── */
        .form-control {
            border: 1px solid var(--erp-border-dk);
            border-radius: 3px;
            font-size: 0.83rem;
            color: var(--erp-text);
            background: white;
            padding: 0.28rem 0.55rem;
            height: auto;
        }
        .form-control:focus {
            border-color: var(--erp-blue-mid);
            box-shadow: 0 0 0 2px rgba(21,101,192,.18);
            outline: none;
        }
        .form-control::placeholder { color: #BDBDBD; }

        /* ── Buttons ── */
        .btn-erp {
            background: linear-gradient(180deg, #FAFAFA 0%, #E8E8E8 100%);
            border: 1px solid #9E9E9E;
            color: #212121;
            font-size: 0.81rem;
            padding: 0.28rem 0.75rem;
            border-radius: 3px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .1s;
        }
        .btn-erp:hover { background: linear-gradient(180deg, #E8F4FF 0%, #C5DCF5 100%); border-color: var(--erp-blue-mid); color: var(--erp-blue-dark); }

        .btn-erp-primary {
            background: linear-gradient(180deg, #2196F3 0%, #1565C0 100%);
            border: 1px solid #0D47A1;
            color: white;
            font-weight: 600;
        }
        .btn-erp-primary:hover { background: linear-gradient(180deg, #42A5F5 0%, #1976D2 100%); color: white; }

        .btn-erp-cyan {
            background: linear-gradient(180deg, #80DEEA 0%, #00838F 100%);
            border: 1px solid #006064;
            color: white;
            font-weight: 600;
            font-size: 0.78rem;
            padding: 3px 10px;
        }
        .btn-erp-cyan:hover { background: linear-gradient(180deg, #B2EBF2 0%, #00ACC1 100%); }
        .btn-erp-cyan.opened {
            background: linear-gradient(180deg, #A5D6A7 0%, #388E3C 100%);
            border-color: #1B5E20;
        }

        /* ── 更新索引進度列 ── */
        .reindex-bar {
            display: none;
            padding: 0.4rem 0.75rem;
            background: #F0F4F8;
            border-bottom: 1px solid var(--erp-border);
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            font-size: 0.82rem;
        }
        .reindex-bar.show { display: flex; }
        .reindex-progress {
            flex: 1;
            min-width: 160px;
            height: 8px;
            border-radius: 4px;
            background: #CFD8DC;
            overflow: hidden;
        }
        .reindex-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #42A5F5, #1565C0);
            border-radius: 4px;
            transition: width .3s;
        }
        .reindex-msg { color: var(--erp-muted); font-size: 0.79rem; flex: 2; min-width: 120px; }
        .reindex-done { color: #2E7D32; font-weight: 700; }
        .reindex-err  { color: #B71C1C; font-weight: 700; }

        /* ── Result toolbar ── */
        .erp-panel-toolbar {
            background: #F0F4F8;
            border-bottom: 1px solid var(--erp-border);
            padding: 0.35rem 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.82rem;
        }
        .toolbar-label { font-weight: 700; color: var(--erp-text); }
        .result-badge {
            background: var(--erp-blue);
            color: white;
            font-family: Consolas, monospace;
            font-size: 0.76rem;
            padding: 1px 7px;
            border-radius: 2px;
            border: 1px solid var(--erp-blue-dark);
        }
        .hint-text { color: var(--erp-muted); font-size: 0.78rem; }

        /* ── Table ── */
        .table-container { max-height: 68vh; overflow-y: auto; }
        .table { margin-bottom: 0; font-size: 0.82rem; border-collapse: collapse; width: 100%; }
        .table thead th {
            position: sticky;
            top: 0;
            background: var(--erp-blue);
            color: white;
            z-index: 2;
            white-space: nowrap;
            font-weight: 600;
            font-size: 0.78rem;
            padding: 0.4rem 0.6rem;
            border: 1px solid #0D47A1;
        }
        .table td {
            vertical-align: middle;
            white-space: nowrap;
            padding: 0.3rem 0.6rem;
            border: 1px solid #D6E4F0;
        }
        .table td.wrap-cell { white-space: normal; max-width: 280px; word-break: break-word; }
        .table tbody tr:hover td { background: var(--erp-row-hover) !important; cursor: pointer; }
        .table tbody tr:nth-child(even) td { background: var(--erp-row-even); }

        /* ── Data cells ── */
        .pin-hao { font-family: 'Noto Sans TC', sans-serif; font-size: 0.82rem; color: var(--erp-text); font-weight: 400; }
        .date-val { font-family: Consolas, monospace; font-size: 0.78rem; color: #37474F; }

        /* ── Status / Loading ── */
        #loading { display: none; }
        #error-msg { display: none; }
        .spinner-border { color: var(--erp-blue) !important; }

        /* ── Initial hint ── */
        .initial-hint {
            text-align: center;
            padding: 3rem 1rem;
            color: #90A4AE;
        }
        .initial-hint .hint-icon { font-size: 2.8rem; margin-bottom: 0.6rem; }
        .initial-hint .hint-main { font-size: 0.95rem; font-weight: 600; color: #546E7A; }
        .initial-hint .hint-sub  { font-size: 0.8rem; margin-top: 0.3rem; color: #90A4AE; }
    </style>
    <link rel="stylesheet" href="/static/pds-ibm.css">
</head>
<body>
    <!-- ── ERP 標題列 ── -->
    <div class="header">
        <div class="header-inner">
            <div class="header-title">加工部查詢系統PDS</div>
            <div class="header-tabs">
                <a href="/" class="header-tab">製令查詢</a>
                <a href="/production" class="header-tab">生產中製令</a>
                <a href="/equipment" class="header-tab">設備稼動</a>
                <span class="header-tab active">PDM圖面查詢</span>
                <a href="/routing"      class="header-tab">產品途程查詢</a>
                <a href="/batch_cost" class="header-tab">批成本</a>
                <a href="/cnc_program" class="header-tab">程式管理</a>
                <a href="/management" class="header-tab header-tab-mgmt">管理</a>
            </div>
            <span class="header-logo">MAXCLAW</span>
        </div>
    </div>

    <div class="page-body">
        <div class="erp-panel">
            <!-- 搜尋列 -->
            <div class="search-row">
                <span class="search-label">品號 / 品名 / 機型：</span>
                <input type="text" id="searchInput" class="form-control" style="width:360px;"
                       placeholder="輸入品號或品名，空格=AND，-前綴=排除  例: FTB150A 夾管座" autofocus>
                <button id="searchBtn" class="btn-erp btn-erp-primary">🔍 查詢</button>
                <span style="flex:1"></span>
                <button id="reindexBtn" class="btn-erp" title="掃描 PDM Vault 並更新圖面索引資料庫">🔄 更新圖檔索引</button>
                <span id="lastIndexedLabel" style="font-size:0.78rem;color:var(--erp-text-muted,#6e6258);white-space:nowrap;"></span>
            </div>

            <!-- 索引更新進度列 -->
            <div class="reindex-bar" id="reindexBar">
                <span id="reindexPhase" style="font-weight:700;color:var(--erp-blue-dark);white-space:nowrap;">更新中...</span>
                <div class="reindex-progress"><div class="reindex-progress-fill" id="reindexFill" style="width:0%"></div></div>
                <span id="reindexMsg" class="reindex-msg"></span>
            </div>

            <!-- 結果工具列 -->
            <div class="erp-panel-toolbar" id="result-toolbar" style="display:none;">
                <span class="toolbar-label">圖面資料</span>
                <span class="result-badge" id="resultCount">0</span>
                <span style="color:#78909C;font-size:0.8rem;">筆</span>
                <span class="hint-text">　雙擊列或點「SW開啟」可直接開啟 PDM 圖面</span>
            </div>

            <!-- loading -->
            <div id="loading" class="text-center py-4">
                <div class="spinner-border" role="status" style="width:1.8rem;height:1.8rem;"></div>
                <div class="mt-2" style="color:#1565C0;font-size:0.85rem;">搜尋 PDM 圖面中...</div>
            </div>

            <!-- error -->
            <div id="error-msg" style="margin:0.6rem;padding:0.5rem 0.8rem;border-left:4px solid #E65100;background:#FFF3E0;color:#BF360C;font-size:0.83rem;"></div>

            <!-- 結果表格 -->
            <div id="result-area" style="display:none;">
                <div class="table-container">
                    <table class="table table-bordered table-sm mb-0">
                        <thead>
                            <tr>
                                <th>品號</th>
                                <th>圖面品名</th>
                                <th>機型</th>
                                <th>型號</th>
                                <th>檔案名稱</th>
                                <th>發圖日期</th>
                                <th style="width:90px;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="resultBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 初始提示 -->
            <div id="initial-hint" class="initial-hint">
                <div class="hint-icon">📐</div>
                <div class="hint-main">輸入品號或品名以查詢 PDM 圖面</div>
                <div class="hint-sub">支援模糊查詢，空格=AND，- 前綴=排除</div>
            </div>
        </div>
    </div>

    <script src="/static/vendor/bootstrap.bundle.min.js"></script>
    <script>
        const searchInput  = document.getElementById('searchInput');
        const searchBtn    = document.getElementById('searchBtn');
        const loading      = document.getElementById('loading');
        const errorMsg     = document.getElementById('error-msg');
        const resultArea   = document.getElementById('result-area');
        const resultBody   = document.getElementById('resultBody');
        const resultCount  = document.getElementById('resultCount');
        const initHint     = document.getElementById('initial-hint');
        const resultToolbar= document.getElementById('result-toolbar');

        window._drawingFiles = [];

        function hideAll() {
            loading.style.display       = 'none';
            errorMsg.style.display      = 'none';
            resultArea.style.display    = 'none';
            resultToolbar.style.display = 'none';
            initHint.style.display      = 'none';
        }

        async function doSearch() {
            const q = searchInput.value.trim();
            if (!q) {
                hideAll();
                errorMsg.textContent = '請輸入品號或品名';
                errorMsg.style.display = 'block';
                return;
            }

            hideAll();
            loading.style.display = 'block';
            searchBtn.disabled = true;

            try {
                const resp = await fetch('/api/drawing/search?q=' + encodeURIComponent(q));
                const json = await resp.json();
                hideAll();

                if (json.success && json.files && json.files.length > 0) {
                    window._drawingFiles = json.files;
                    resultBody.innerHTML = '';
                    resultCount.textContent = json.files.length;

                    json.files.forEach((f, idx) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML =
                            '<td><span class="pin-hao">' + esc(f.pin_hao) + '</span></td>' +
                            '<td class="wrap-cell">' + esc(f.product_name) + '</td>' +
                            '<td>' + (f.ji_xing ? '<span style="background:#E3F2FD;color:#0D47A1;padding:0 5px;border:1px solid #90CAF9;font-size:0.75rem;border-radius:2px;">' + esc(f.ji_xing) + '</span>' : '') + '</td>' +
                            '<td>' + esc(f.xing_hao) + '</td>' +
                            '<td class="wrap-cell" style="font-family:Consolas,monospace;font-size:0.78rem;">' + esc(f.file_name) + '</td>' +
                            '<td class="date-val">' + esc(f.modified_at) + '</td>' +
                            '<td class="text-center">' +
                                '<button class="btn-erp btn-erp-cyan open-btn" data-idx="' + idx + '">📐 SW開啟</button>' +
                            '</td>';
                        resultBody.appendChild(tr);
                    });

                    resultArea.style.display    = 'block';
                    resultToolbar.style.display = 'flex';
                } else {
                    errorMsg.innerHTML =
                        '<strong>查無圖面</strong> — ' + esc(json.error || '找不到符合條件的圖面') +
                        '<br><small>提示：可嘗試只輸入關鍵字，或用機型代號（如 FTB150）搜尋</small>';
                    errorMsg.style.display = 'block';
                }
            } catch (e) {
                hideAll();
                errorMsg.textContent = '查詢失敗: ' + e.message;
                errorMsg.style.display = 'block';
            } finally {
                searchBtn.disabled = false;
            }
        }

        // 事件委派：開啟按鈕 + 雙擊列
        resultBody.addEventListener('click', function(e) {
            const btn = e.target.closest('.open-btn');
            if (btn) doOpen(btn);
        });
        resultBody.addEventListener('dblclick', function(e) {
            const tr = e.target.closest('tr');
            if (tr) { const btn = tr.querySelector('.open-btn'); if (btn && !btn.disabled) doOpen(btn); }
        });

        function doOpen(btn) {
            const idx = parseInt(btn.dataset.idx);
            const f = window._drawingFiles[idx];
            if (!f) { alert('找不到檔案資訊'); return; }

            const origHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" style="width:.85em;height:.85em;"></span>';

            fetch('/api/drawing/open', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file_path: f.file_path }),
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    btn.innerHTML = '✔ 已開啟';
                    btn.classList.add('opened');
                    setTimeout(() => { btn.innerHTML = origHTML; btn.classList.remove('opened'); btn.disabled = false; }, 4000);
                } else {
                    alert('開啟失敗: ' + data.error);
                    btn.innerHTML = origHTML;
                    btn.disabled = false;
                }
            })
            .catch(err => {
                alert('開啟失敗: ' + err.message);
                btn.innerHTML = origHTML;
                btn.disabled = false;
            });
        }

        function esc(s) {
            if (!s) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

        /* ── 更新圖檔索引 ── */
        const reindexBtn  = document.getElementById('reindexBtn');
        const reindexBar  = document.getElementById('reindexBar');
        const reindexPhase= document.getElementById('reindexPhase');
        const reindexFill = document.getElementById('reindexFill');
        const reindexMsg  = document.getElementById('reindexMsg');
        let _reindexTimer = null;

        reindexBtn.addEventListener('click', async () => {
            if (reindexBtn.disabled) return;
            reindexBtn.disabled = true;
            reindexBar.classList.add('show');
            reindexPhase.textContent = '啟動中...';
            reindexPhase.className = '';
            reindexFill.style.width = '0%';
            reindexMsg.textContent = '';

            try {
                const resp = await fetch('/api/drawing/reindex', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ update_only: true })
                });
                const json = await resp.json();
                if (!json.success) {
                    showReindexError(json.error || '啟動失敗');
                    return;
                }
                _reindexTimer = setInterval(pollReindexStatus, 2000);
            } catch (e) {
                showReindexError(e.message);
            }
        });

        async function pollReindexStatus() {
            try {
                const resp = await fetch('/api/drawing/reindex/status');
                const s = await resp.json();

                if (s.phase === 'scanning') {
                    reindexPhase.textContent = '掃描中';
                    reindexFill.style.width = '20%';
                    reindexMsg.textContent = s.scanned > 0 ? `已掃描 ${s.scanned.toLocaleString()} 個檔案` : s.message;

                } else if (s.phase === 'indexing') {
                    reindexPhase.textContent = '寫入索引';
                    const pct = s.total > 0 ? Math.round(20 + (s.indexed / s.total) * 78) : 50;
                    reindexFill.style.width = pct + '%';
                    reindexMsg.textContent = s.total > 0
                        ? `${s.indexed.toLocaleString()} / ${s.total.toLocaleString()} 筆`
                        : s.message;

                } else if (s.phase === 'done') {
                    clearInterval(_reindexTimer); _reindexTimer = null;
                    reindexFill.style.width = '100%';
                    reindexPhase.textContent = '完成';
                    reindexPhase.className = 'reindex-done';
                    reindexMsg.textContent = s.message || `共 ${s.last_count.toLocaleString()} 筆圖面`;
                    reindexBtn.disabled = false;
                    _showLastIndexed(s.last_run, s.last_count);
                    setTimeout(() => { reindexBar.classList.remove('show'); }, 8000);

                } else if (s.phase === 'error') {
                    clearInterval(_reindexTimer); _reindexTimer = null;
                    showReindexError(s.error || '未知錯誤');
                }
            } catch (e) {
                // 網路短暫中斷，繼續輪詢
            }
        }

        function showReindexError(msg) {
            if (_reindexTimer) { clearInterval(_reindexTimer); _reindexTimer = null; }
            reindexPhase.textContent = '失敗';
            reindexPhase.className = 'reindex-err';
            reindexMsg.textContent = msg;
            reindexFill.style.width = '100%';
            reindexFill.style.background = '#E53935';
            reindexBtn.disabled = false;
        }

        // ── 上次更新時間 ────────────────────────────────────
        const lastIndexedLabel = document.getElementById('lastIndexedLabel');

        function _showLastIndexed(ts, cnt) {
            if (!ts) { lastIndexedLabel.textContent = ''; return; }
            const cntStr = cnt ? `，共 ${Number(cnt).toLocaleString()} 筆` : '';
            lastIndexedLabel.textContent = `索引更新：${ts}${cntStr}`;
        }

        // 頁面載入時立即查詢
        (async () => {
            try {
                const res = await fetch('/api/drawing/reindex/status');
                const s   = await res.json();
                _showLastIndexed(s.last_run, s.last_count);
            } catch(e) {}
        })();

        // ── State persistence ──────────────────────────────
        const _DRW_KEY = 'pds_drawing';
        function _saveDrawingState() {
          try {
            sessionStorage.setItem(_DRW_KEY, JSON.stringify({
              _ts: Date.now(),
              query: searchInput.value,
              files: window._drawingFiles || []
            }));
          } catch(e) {}
        }
        function _restoreDrawingState() {
          try {
            const raw = sessionStorage.getItem(_DRW_KEY);
            if (!raw) return;
            const s = JSON.parse(raw);
            if (!s || (Date.now() - s._ts) > 3_600_000) return;
            if (s.query) searchInput.value = s.query;
            if (s.files && s.files.length) {
              window._drawingFiles = s.files;
              resultBody.innerHTML = '';
              resultCount.textContent = s.files.length;
              s.files.forEach((f, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML =
                  '<td><span class="pin-hao">' + esc(f.pin_hao) + '</span></td>' +
                  '<td class="wrap-cell">' + esc(f.product_name) + '</td>' +
                  '<td>' + (f.ji_xing ? '<span style="background:#E3F2FD;color:#0D47A1;padding:0 5px;border:1px solid #90CAF9;font-size:0.75rem;border-radius:2px;">' + esc(f.ji_xing) + '</span>' : '') + '</td>' +
                  '<td>' + esc(f.xing_hao) + '</td>' +
                  '<td class="wrap-cell" style="font-family:Consolas,monospace;font-size:0.78rem;">' + esc(f.file_name) + '</td>' +
                  '<td class="date-val">' + esc(f.modified_at) + '</td>' +
                  '<td class="text-center">' +
                    '<button class="btn-erp btn-erp-cyan open-btn" data-idx="' + idx + '">📐 SW開啟</button>' +
                  '</td>';
                resultBody.appendChild(tr);
              });
              initHint.style.display      = 'none';
              resultArea.style.display    = 'block';
              resultToolbar.style.display = 'flex';
            }
          } catch(e) {}
        }
        // 每次搜尋成功後存檔（在已有的 doSearch 成功路徑加 hook）
        const _origDrawSearch = doSearch;
        doSearch = async function() {
          await _origDrawSearch();
          if (window._drawingFiles && window._drawingFiles.length) _saveDrawingState();
        };
        _restoreDrawingState();
    </script>
</body>
</html>
