<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加工部查詢系統PDS - 生產中製令</title>
    <link rel="icon" type="image/png" href="/static/app-icon.png">
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ══════════════════════════════════════════
           ERP Classic Blue — Production Monitor
           ══════════════════════════════════════════ */
        :root {
            --erp-blue:       #1565C0;
            --erp-blue-dark:  #0D47A1;
            --erp-blue-light: #E3F2FD;
            --erp-border:     #B0BEC5;
            --erp-bg:         #CFD8DC;
            --th-grad-top:    #E3F2FD;
            --th-grad-bot:    #BBDEFB;
            /* Claude-style warm palette */
            --cl-bg:      #F5F4ED;
            --cl-card:    #FFFFFF;
            --cl-border:  #E5E4DF;
            --cl-text:    #3D3D3A;
            --cl-text2:   #8A8778;
            --cl-accent:  #D97757;
            --cl-accent-d:#C5613F;
            --cl-th-top:  #FAF9F5;
            --cl-th-bot:  #F0EDE4;
            --cl-row-alt: #FAF9F5;
            --cl-hover:   #FBEFE6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, * {
            font-family: 'Noto Sans TC', 'Source Han Sans TC', sans-serif;
        }
        body {
            font-size: 12.5px;
            background: var(--cl-bg);
            color: var(--cl-text);
        }

        /* ── Header ── */
        .header {
            background: #1565C0;
            color: white; padding: 0;
            position: sticky; top: 0; z-index: 200;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .header-inner { display: flex; align-items: flex-end; padding: 0.4rem 1rem 0; }
        .header-logo { margin-left:auto; align-self:center; font-size:1.15rem; font-weight:800; font-style:italic; letter-spacing:.03em; color:#F5A623; }
        .header-title{font-size:1.1rem;font-weight:700;padding-bottom:.45rem;white-space:nowrap;margin-right:.5rem}
        .header-tabs{display:flex;align-items:flex-end;gap:2px}
        .header-tab{display:inline-block;padding:.3rem 1rem;font-size:1rem;font-weight:600;
          color:rgba(255,255,255,.85);text-decoration:none;border-radius:0;
          background:rgba(255,255,255,.15);cursor:pointer;transition:background .15s}
        .header-tab.active,.header-tab:hover{background:#fff;color:#1565C0}

        
        .header-tab-mgmt{background:#06C755;color:#fff}
        .header-tab-mgmt.active,.header-tab-mgmt:hover{background:#05A649;color:#fff}/* ── Toolbar ── */
        .toolbar-wrap {
            background: var(--cl-th-top);
            border-bottom: 1px solid var(--cl-border);
            padding: 8px 12px;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .toolbar-wrap label { font-weight: 700; font-size: 13px; color: var(--cl-text); }
        .toolbar-wrap select {
            padding: 4px 10px; border: 1px solid var(--cl-border); border-radius: 6px;
            font-size: 13px; font-weight: 600; min-width: 80px;
            background: var(--cl-card); color: var(--cl-text);
        }
        .toolbar-wrap select:focus { border-color: var(--cl-accent); outline: none; }
        .btn-erp {
            padding: 5px 18px; border: none; border-radius: 6px;
            font-weight: 700; cursor: pointer; font-size: 13px; color: white;
            display: inline-flex; align-items: center; gap: 4px;
            transition: background .15s;
        }
        .btn-erp-blue { background: var(--cl-accent); }
        .btn-erp-blue:hover { background: var(--cl-accent-d); }
        .toolbar-info {
            margin-left: auto; font-size: 12px; color: var(--cl-text2);
        }
        .toolbar-info b { color: var(--cl-accent); font-size: 14px; }
        .toolbar-info .update-time { color: var(--cl-text2); margin-left: 10px; }

        /* ── Table ── */
        .table-container {
            margin: 8px;
            background: var(--cl-card);
            border: 1px solid var(--cl-border);
            border-radius: 10px;
            overflow: auto;
            box-shadow: 0 2px 10px rgba(61,57,41,.08);
            max-height: min(calc(20 * 38px + 50px), calc(100vh - 120px));
        }
        table {
            width: 100%; border-collapse: collapse;
            font-size: 12px; white-space: nowrap;
        }
        thead th {
            background: linear-gradient(180deg, var(--cl-th-top), var(--cl-th-bot));
            color: var(--cl-text);
            font-weight: 700; font-size: 11px;
            padding: 5px 6px;
            border: 1px solid var(--cl-border);
            text-align: center;
            position: sticky; top: 0; z-index: 10;
            cursor: pointer; user-select: none;
            line-height: 1.3;
        }
        thead th:hover { background: var(--cl-hover); }
        thead th.sorted-asc::after { content: ' \25B2'; font-size: 9px; color: var(--cl-accent); }
        thead th.sorted-desc::after { content: ' \25BC'; font-size: 9px; color: var(--cl-accent); }

        tbody td {
            padding: 3px 6px;
            border: 1px solid var(--cl-border);
            vertical-align: middle;
        }
        tbody tr:nth-child(even) { background: var(--cl-row-alt); }
        tbody tr:hover td { background: var(--cl-hover) !important; }

        /* ── 數值欄 ── */
        .cell-num { text-align: right; font-family: Consolas, 'Courier New', monospace; font-weight: 600; }
        .cell-center { text-align: center; }

        /* ── 生產狀況 ── */
        .st-producing { background: #E7F0E3; color: #5C8553; padding: 1px 8px; border-radius: 3px; font-weight: 700; font-size: 11px; }
        .st-paused { background: #C0392B; color: #FFF; padding: 1px 8px; border-radius: 3px; font-weight: 700; font-size: 11px; }
        .st-other { background: #FBE8D2; color: #B5651D; padding: 1px 8px; border-radius: 3px; font-weight: 700; font-size: 11px; }

        /* ── 即時生產量 highlight ── */
        .rt-hi { background: #FBEFE6 !important; font-weight: 900; color: var(--cl-accent-d); font-family: Consolas, monospace; }
        .rt-zero { color: var(--cl-text2); font-weight: 700; font-family: Consolas, monospace; }
        .rt-positive { color: var(--cl-accent-d); font-weight: 900; font-family: Consolas, monospace; font-size: 13px; }

        /* ── SFT 完工日過期紅字 ── */
        .date-overdue { color: #C0392B; font-weight: 700; }

        /* ── Loading ── */
        .loading-overlay {
            display: flex; align-items: center; justify-content: center;
            padding: 60px; color: var(--cl-text2); font-size: 15px; gap: 10px;
        }
        .spinner { width: 24px; height: 24px; border: 3px solid var(--cl-border); border-top-color: var(--cl-accent); border-radius: 50%; animation: spin .6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { color: #C0392B; padding: 30px; text-align: center; font-size: 14px; }
    </style>
    <link rel="stylesheet" href="/static/pds-ibm.css">
</head>
<body>
    <!-- ── Header ── -->
    <div class="header">
        <div class="header-inner">
            <div class="header-title">加工部查詢系統PDS</div>
            <div class="header-tabs">
                <a href="/" class="header-tab">製令查詢</a>
                <span class="header-tab active">生產中製令</span>
                <a href="/equipment" class="header-tab">設備稼動</a>
                <a href="/drawing" class="header-tab">PDM圖面查詢</a>
                <a href="/routing"      class="header-tab">產品途程查詢</a>
                <a href="/batch_cost" class="header-tab">批成本</a>
                <a href="/cnc_program" class="header-tab">程式管理</a>
                <a href="/management" class="header-tab header-tab-mgmt">管理</a>
            </div>
            <span class="header-logo">MAXCLAW</span>
        </div>
    </div>

    <!-- ── Toolbar ── -->
    <div class="toolbar-wrap">
        <label>查看組別：</label>
        <select id="groupFilter">
            <option value="">全部</option>
            <option value="BN">BN</option>
            <option value="DR">DR</option>
            <option value="NC">NC</option>
            <option value="PC">PC</option>
            <option value="SN">SN</option>
            <option value="SP">SP</option>
        </select>
        <button class="btn-erp btn-erp-blue" onclick="loadData()">🔄 重新整理</button>
        <div class="toolbar-info" id="infoBar"></div>
    </div>

    <!-- ── Table ── -->
    <div class="table-container">
        <div class="loading-overlay" id="loadingMsg"><div class="spinner"></div>載入中...</div>
        <div class="error-msg" id="errorMsg" style="display:none"></div>
        <table id="dataTable" style="display:none">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
    // ══════════════════════════════════════════════
    //  Column Definition — 自動偵測 SSRS CSV 欄位名稱
    //  aliases: 多個可能的 CSV 欄位名稱（自動匹配第一個找到的）
    // ══════════════════════════════════════════════
    const COLUMNS = [
        { id: 'machine',    label: '生產機台',        w: '72px',  cls: 'cell-center',
          aliases: ['生產機台'] },
        { id: 'order',      label: '製令',            w: '150px',
          aliases: ['製令'] },
        { id: 'status',     label: '生產\n狀況',      w: '58px',  cls: 'cell-center', render: 'status',
          aliases: ['Textbox21', '生產狀況'] },
        { id: 'process',    label: '製程',            w: '42px',  cls: 'cell-center',
          aliases: ['製程'] },
        { id: 'product',    label: '品名',            w: '200px',
          aliases: ['品名'] },
        { id: 'stdtime',    label: '標工\n(秒)',      w: '55px',  cls: 'cell-num',
          aliases: ['ERP變動人時3', '標工_秒'] },
        { id: 'startdate',  label: '預計開工日\nSFT', w: '85px',  cls: 'cell-center',
          aliases: ['SFT預計開工日'] },
        { id: 'enddate',    label: '預計完工日\nSFT', w: '85px',  cls: 'cell-center', render: 'finishDate',
          aliases: ['SFT預計完工日'] },
        { id: 'releasedate',label: '最早\n發放日',    w: '78px',  cls: 'cell-center',
          aliases: ['最早發放日'] },
        { id: 'checkin',    label: '實際報工\n進站時間', w: '105px', cls: 'cell-center',
          aliases: ['進站時間3', '實際報工進站時間'] },
        { id: 'planqty',    label: '預計\n生產量',    w: '70px',  cls: 'cell-num',
          aliases: ['預計產量', '預計生產量'] },
        { id: 'realtime',   label: '即時\n生產量',    w: '70px',  cls: 'cell-num', render: 'realtime',
          aliases: ['現在產量', '即時生產量'] },
        { id: 'remain',     label: '完工仍需\n(小時)', w: '72px', cls: 'cell-num',
          aliases: ['Textbox11'] },
        { id: 'today',      label: '本日-含加班\n已生產/應生產', w: '110px', cls: 'cell-center',
          aliases: ['Textbox10'] },
        { id: 'thishour',   label: '本小時\n已生產/應生產',     w: '100px', cls: 'cell-center',
          aliases: ['Textbox31'] },
        { id: 'usetime',    label: '使用時間\n(分)',  w: '72px',  cls: 'cell-num',
          aliases: ['Textbox15'] },
    ];

    // 實際匹配到的 CSV key（loadData 時解析）
    let colKeyMap = {};  // id → actual csv key
    let allData = [], sortCol = null, sortAsc = true;
    let lastUpdateTime = null;
    const CACHE_KEY = 'pds_production_cache';

    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function num(s) { return parseFloat(String(s || '0').replace(/,/g, '')) || 0; }

    // ── 從實際欄位名稱中匹配 aliases ──
    function resolveColumns(csvColumns) {
        colKeyMap = {};
        const csvSet = new Set(csvColumns);
        COLUMNS.forEach(col => {
            col._csvKey = null;
            for (const alias of col.aliases) {
                if (csvSet.has(alias)) { col._csvKey = alias; colKeyMap[col.id] = alias; break; }
            }
            // 模糊匹配：如果精確匹配失敗，嘗試包含匹配
            if (!col._csvKey) {
                for (const csvCol of csvColumns) {
                    for (const alias of col.aliases) {
                        if (csvCol.includes(alias) || alias.includes(csvCol)) {
                            col._csvKey = csvCol; colKeyMap[col.id] = csvCol; break;
                        }
                    }
                    if (col._csvKey) break;
                }
            }
        });
        // 除錯
        const matched = COLUMNS.filter(c => c._csvKey).map(c => c.label.replace('\n','') + '→' + c._csvKey);
        const unmatched = COLUMNS.filter(c => !c._csvKey).map(c => c.label.replace('\n',''));
        console.log('欄位對應成功:', matched);
        if (unmatched.length) console.warn('欄位未對應:', unmatched);
        // 列出未使用的 CSV 欄位
        const usedKeys = new Set(Object.values(colKeyMap));
        const unused = csvColumns.filter(c => !usedKeys.has(c));
        if (unused.length) console.warn('CSV 未使用欄位:', unused);
    }

    function getVal(row, col) {
        return col._csvKey ? (row[col._csvKey] || '') : '';
    }

    // ── Build Header ──
    function buildHeader() {
        const tr = document.getElementById('tableHead');
        tr.innerHTML = '';
        COLUMNS.forEach(col => {
            const th = document.createElement('th');
            th.style.width = col.w || 'auto';
            th.innerHTML = esc(col.label).replace(/\n/g, '<br>');
            th.dataset.id = col.id;
            th.onclick = () => toggleSort(col.id);
            tr.appendChild(th);
        });
        updateSortIndicator();
    }

    function toggleSort(id) {
        if (sortCol === id) sortAsc = !sortAsc;
        else { sortCol = id; sortAsc = true; }
        updateSortIndicator();
        renderTable();
    }

    function updateSortIndicator() {
        document.querySelectorAll('#tableHead th').forEach(th => {
            th.classList.remove('sorted-asc', 'sorted-desc');
            if (th.dataset.id === sortCol) th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
        });
    }

    // ── Get Group ──
    function getGroup(machine) {
        const m = (machine || '').trim();
        if (!m) return '';
        const match = m.match(/^([A-Z]+)/i);
        return match ? match[1].toUpperCase() : m;
    }

    function getMachine(row) {
        const mc = COLUMNS.find(c => c.id === 'machine');
        return mc ? getVal(row, mc) : '';
    }

    // ── Render Cell ──
    function renderCell(td, col, val) {
        if (col.cls) td.className = col.cls;

        switch (col.render) {
            case 'status': {
                const s = (val || '').trim();
                if (s === '生產中') td.innerHTML = '<span class="st-producing">' + esc(s) + '</span>';
                else if (s === '暫停') td.innerHTML = '<span class="st-paused">' + esc(s) + '</span>';
                else if (s) td.innerHTML = '<span class="st-other">' + esc(s) + '</span>';
                break;
            }
            case 'realtime': {
                const n = num(val);
                if (n > 0) {
                    td.innerHTML = '<span class="rt-positive">' + n.toLocaleString() + '</span>';
                    td.classList.add('rt-hi');
                } else {
                    td.innerHTML = '<span class="rt-zero">0</span>';
                }
                break;
            }
            case 'finishDate': {
                td.textContent = val || '';
                if (val) {
                    try {
                        const d = new Date(val);
                        if (d < new Date() && !isNaN(d)) td.classList.add('date-overdue');
                    } catch(e) {}
                }
                break;
            }
            default:
                td.textContent = val || '';
        }
    }

    // ── Render Table ──
    function renderTable() {
        const filter = document.getElementById('groupFilter').value;
        let data = filter ? allData.filter(r => getGroup(getMachine(r)) === filter) : [...allData];

        // Sort
        if (sortCol) {
            const sc = COLUMNS.find(c => c.id === sortCol);
            if (sc) {
                data.sort((a, b) => {
                    let va = getVal(a, sc), vb = getVal(b, sc);
                    const na = num(va), nb = num(vb);
                    const isNum = va !== '' && vb !== '' && !isNaN(parseFloat(va)) && !isNaN(parseFloat(vb));
                    let cmp = isNum ? na - nb : String(va).localeCompare(String(vb));
                    return sortAsc ? cmp : -cmp;
                });
            }
        }

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        data.forEach(row => {
            const tr = document.createElement('tr');
            COLUMNS.forEach(col => {
                const td = document.createElement('td');
                renderCell(td, col, getVal(row, col));
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        const now = lastUpdateTime || new Date();
        const timeStr = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0') + ' '
                      + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        document.getElementById('infoBar').innerHTML =
            '製令資料 <b>' + data.length + '</b> 筆' +
            (filter ? ' (篩選: ' + filter + ')' : '') +
            '<span class="update-time">更新時間: ' + timeStr + '</span>';
    }

    // ── Load Data ──
    async function loadData() {
        const loading = document.getElementById('loadingMsg');
        const table = document.getElementById('dataTable');
        const err = document.getElementById('errorMsg');
        loading.style.display = 'flex'; table.style.display = 'none'; err.style.display = 'none';

        try {
            const resp = await fetch('/api/production');
            const json = await resp.json();
            if (!json.success) throw new Error(json.error || '查詢失敗');

            allData = json.data;

            // 從 API 回傳或從第一筆資料取得欄位名稱
            const csvCols = json.columns || (allData.length > 0 ? Object.keys(allData[0]) : []);
            console.log('SSRS CSV 原始欄位:', csvCols);
            resolveColumns(csvCols);

            // 預設排序
            if (!sortCol) sortCol = 'machine';

            lastUpdateTime = new Date();
            try {
                sessionStorage.setItem(CACHE_KEY, JSON.stringify({
                    allData, csvCols, lastUpdateTime: lastUpdateTime.toISOString()
                }));
            } catch (e) {}

            loading.style.display = 'none';
            table.style.display = 'table';
            buildHeader();
            renderTable();
        } catch (e) {
            loading.style.display = 'none';
            err.textContent = '載入失敗: ' + e.message;
            err.style.display = 'block';
        }
    }

    // ── 初始化：若有快取資料則直接顯示，不重新整理（除非按「重新整理」）──
    function initFromCache() {
        try {
            const cached = sessionStorage.getItem(CACHE_KEY);
            if (!cached) return false;
            const obj = JSON.parse(cached);
            if (!obj.allData || !obj.allData.length) return false;
            allData = obj.allData;
            lastUpdateTime = new Date(obj.lastUpdateTime);
            resolveColumns(obj.csvCols || Object.keys(allData[0]));
            if (!sortCol) sortCol = 'machine';
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('dataTable').style.display = 'table';
            buildHeader();
            renderTable();
            return true;
        } catch (e) { return false; }
    }

    document.getElementById('groupFilter').onchange = renderTable;
    buildHeader();
    if (!initFromCache()) loadData();
    </script>
</body>
</html>
